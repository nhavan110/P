name: Update Portfolio

on:
  schedule:
    # Chạy 1 lần/ngày lúc 11:00 UTC = 18:00 giờ Việt Nam (UTC+7, không có giờ mùa hè)
    - cron: '0 11 * * *'
  workflow_dispatch: {}   # cho phép bấm "Run workflow" chạy tay để test

permissions:
  contents: write

env:
  GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
  GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
  # ID của folder "đc/" trên Google Drive (chứa TCB/TCB.xlsx, HPG/HPG.xlsx, ...)
  # dùng cho tab "Phân tích doanh nghiệp". Để trống nếu chưa dùng tính năng này.
  GOOGLE_DRIVE_COMPANIES_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_COMPANIES_FOLDER_ID }}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run update script
        run: python update_portfolio.py

      - name: Upload MyPortfolio.xlsx to Google Drive
        run: python upload_to_drive.py

      - name: Fetch company financials (tab Phân tích doanh nghiệp)
        run: python fetch_company_financials.py

      - name: Commit and push updated data
        run: |
          git config user.name "portfolio-bot"
          git config user.email "actions@github.com"
          git add data/ manual_entries.csv
          git diff --cached --quiet || git commit -m "Auto update portfolio $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
