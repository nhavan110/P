<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
  if (typeof LightweightCharts === 'undefined') {
    document.write('<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"><\/script>');
  }
</script>
<style>
  :root{
    --bg:#0a0e12;
    --panel:#11161c;
    --panel-border:#1e2630;
    --text:#e7ecf1;
    --muted:#7c8b9a;
    --mint:#3ddc97;
    --coral:#f8615a;
    --amber:#f0b64c;
    --line-vni:#7a8ea3;
    --violet:#9e7ade;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'JetBrains Mono', monospace;
    min-height:100vh;
    padding:20px 16px 60px;
  }
  .wrap{max-width:760px; margin:0 auto;}

  header{margin-bottom:28px;}
  .eyebrow{
    font-size:11px; letter-spacing:0.16em; text-transform:uppercase;
    color:var(--muted); margin-bottom:6px;
  }
  h1{
    font-family:'Space Grotesk', sans-serif;
    font-size:22px; font-weight:700; letter-spacing:-0.01em;
  }
  .updated{font-size:11px; color:var(--muted); margin-top:4px;}

  .hero{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:14px;
    padding:24px 20px;
    margin-bottom:16px;
  }
  .hero-value{
    font-family:'Space Grotesk', sans-serif;
    font-size:38px; font-weight:700; letter-spacing:-0.01em;
    line-height:1.1;
  }
  .hero-sub{
    display:flex; gap:18px; margin-top:14px; flex-wrap:wrap;
  }
  .pill{
    font-size:13px; font-weight:500;
    display:flex; align-items:center; gap:6px;
  }
  .pill .lbl{color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:0.08em;}
  .pos{color:var(--mint);}
  .neg{color:var(--coral);}

  .grid{
    display:grid; grid-template-columns:repeat(2, 1fr); gap:10px;
    margin-bottom:16px;
  }
  .grid.cols-3{ grid-template-columns:repeat(3, 1fr); }
  .stat{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:12px;
    padding:14px 16px;
  }
  .stat .lbl{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:6px;}
  .stat .val{font-size:19px; font-weight:700; font-family:'Space Grotesk', sans-serif;}
  .stat .sub{font-size:10.5px; color:var(--muted); margin-top:4px;}

  .chart-panel{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:14px;
    padding:18px 14px 14px;
    margin-bottom:16px;
  }
  .chart-title{
    font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.1em;
    margin-bottom:12px; padding:0 4px;
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;
  }
  .legend{display:flex; gap:14px; font-size:11px; text-transform:none; letter-spacing:0;}
  .legend span{display:flex; align-items:center; gap:5px;}
  .dot{width:8px; height:8px; border-radius:50%; display:inline-block;}

  .chart-controls{
    display:flex; flex-wrap:wrap; gap:8px;
    margin-bottom:12px; padding:0 4px;
  }
  .seg{
    display:flex; background:var(--bg); border:1px solid var(--panel-border);
    border-radius:8px; overflow:hidden;
  }
  .seg button{
    background:transparent; border:none; color:var(--muted);
    font-family:'JetBrains Mono', monospace; font-size:11px; font-weight:500;
    padding:6px 11px; cursor:pointer; transition:background .15s, color .15s;
    border-right:1px solid var(--panel-border);
    white-space:nowrap;
  }
  .seg button:last-child{border-right:none;}
  .seg button.active{background:var(--mint); color:#04231a; font-weight:700;}
  .seg button:hover:not(.active){color:var(--text);}

  .chart-wrap{position:relative;}
  #chartContainer{width:100%; height:280px;}
  #ddChartContainer{width:100%; height:220px;}

  .chart-tooltip{
    position:absolute; top:6px; left:6px; pointer-events:none;
    background:rgba(10,14,18,0.92); border:1px solid var(--panel-border);
    border-radius:8px; padding:8px 10px; font-size:11px; line-height:1.6;
    color:var(--text); display:none; z-index:5; white-space:nowrap;
    max-width:240px;
  }
  .chart-tooltip .tt-date{color:var(--muted); margin-bottom:3px; font-size:10px; text-transform:uppercase; letter-spacing:0.05em;}
  .chart-tooltip .tt-row{display:flex; gap:8px; justify-content:space-between;}
  .chart-tooltip .tt-row .tt-lbl{color:var(--muted);}
  .chart-tooltip .tt-up{color:var(--mint);}
  .chart-tooltip .tt-down{color:var(--coral);}
  .chart-tooltip .tt-sep{border-top:1px solid var(--panel-border); margin:5px 0 4px;}
  .chart-tooltip .tt-tx{margin-bottom:3px;}
  .chart-tooltip .tt-tx-head{font-weight:700; letter-spacing:0.03em; margin-bottom:1px;}
  .chart-tooltip .tt-tx-head.buy{color:var(--mint);}
  .chart-tooltip .tt-tx-head.sell{color:var(--coral);}

  .empty{
    text-align:center; padding:60px 20px; color:var(--muted); font-size:13px; line-height:1.6;
  }
  .empty code{
    background:var(--panel); padding:2px 6px; border-radius:4px; color:var(--amber);
  }

  /* ── Bảng dữ liệu ── */
  .table-panel{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:14px;
    padding:18px 14px 16px;
    margin-bottom:16px;
  }
  .table-title{
    font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.1em;
    margin-bottom:12px; padding:0 4px;
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;
  }
  .table-hint{font-size:10px; color:var(--muted); text-transform:none; letter-spacing:0;}
  .table-scroll{
    overflow:auto; max-height:560px; border:1px solid var(--panel-border); border-radius:10px;
  }
  table.dtable{
    border-collapse:collapse; font-size:11px; white-space:nowrap; min-width:100%;
  }
  table.dtable th, table.dtable td{
    padding:6px 9px; text-align:right; border-bottom:1px solid var(--panel-border);
    border-right:1px solid var(--panel-border);
  }
  table.dtable th{
    position:sticky; top:0; z-index:2;
    background:#161d25; color:var(--text); font-weight:700; text-align:right;
    font-family:'Space Grotesk', sans-serif; font-size:10.5px;
  }
  table.dtable td.dt-date, table.dtable th.dt-date{
    text-align:left; position:sticky; left:0; z-index:1;
    background:#0d1218;
  }
  table.dtable th.dt-date{ z-index:3; }
  table.dtable td.dt-date{ color:var(--text); font-weight:500; }
  table.dtable tbody tr:hover td{ background:#161d25; }
  table.dtable tbody tr:hover td.dt-date{ background:#1a222c; }
  table.dtable td.g-price{ background:rgba(61,220,151,0.06); }
  table.dtable td.g-cyan{ background:rgba(122,208,230,0.06); }
  table.dtable td.g-vni{ background:rgba(240,182,76,0.07); }
  table.dtable td.g-cash{ background:rgba(90,140,230,0.08); }
  table.dtable td.g-stat{ background:rgba(158,122,222,0.09); font-weight:500; }
  table.dtable th.g-price{ color:var(--mint); }
  table.dtable th.g-cyan{ color:#7ad0e6; }
  table.dtable th.g-vni{ color:var(--amber); }
  table.dtable th.g-cash{ color:#9db8f0; }
  table.dtable th.g-stat{ color:#c3aef2; }

  /* ── Bộ chọn kỳ (Tổng lịch sử / từng năm) ── */
  .period-select{
    background:var(--bg); border:1px solid var(--panel-border); color:var(--text);
    font-family:'JetBrains Mono', monospace; font-size:12px; font-weight:500;
    padding:7px 10px; border-radius:8px; cursor:pointer;
  }
  .period-row{ display:flex; justify-content:flex-end; margin-bottom:14px; }

  /* ── Allocation (thanh ngang) ── */
  .alloc-panel{
    background:var(--panel); border:1px solid var(--panel-border);
    border-radius:14px; padding:18px 16px 16px; margin-bottom:16px;
  }
  .alloc-title{
    font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.1em;
    margin-bottom:14px;
  }
  .alloc-row{ display:flex; align-items:center; gap:10px; margin-bottom:11px; }
  .alloc-row:last-child{ margin-bottom:0; }
  .alloc-name{ width:58px; flex:0 0 auto; font-size:12px; font-weight:700; font-family:'Space Grotesk', sans-serif; }
  .alloc-bar-wrap{ flex:1; height:9px; background:var(--bg); border-radius:5px; overflow:hidden; }
  .alloc-bar{ height:100%; border-radius:5px; background:linear-gradient(90deg, var(--mint), #2ab884); }
  .alloc-pct{ width:52px; flex:0 0 auto; text-align:right; font-size:12px; font-weight:700; font-family:'Space Grotesk', sans-serif; }

  /* ── Position contribution ── */
  .contrib-panel{
    background:var(--panel); border:1px solid var(--panel-border);
    border-radius:14px; padding:18px 14px 16px; margin-bottom:16px;
  }
  table.ctable{ border-collapse:collapse; width:100%; font-size:12px; }
  table.ctable th{
    text-align:right; padding:8px 8px; color:var(--muted); font-weight:700;
    font-family:'Space Grotesk', sans-serif; font-size:10.5px; text-transform:uppercase;
    letter-spacing:0.05em; border-bottom:1px solid var(--panel-border);
  }
  table.ctable th:first-child, table.ctable td:first-child{ text-align:left; }
  table.ctable td{ text-align:right; padding:9px 8px; border-bottom:1px solid var(--panel-border); }
  table.ctable td:first-child{ font-weight:700; font-family:'Space Grotesk', sans-serif; }
  table.ctable tr:last-child td{ border-bottom:none; }
  table.ctable tr:hover td{ background:#161d25; }

  footer{
    text-align:center; margin-top:24px; font-size:10px; color:var(--muted);
  }

  /* ── Điều hướng trang ── */
  nav.tabs{
    display:flex; gap:5px; background:var(--panel); border:1px solid var(--panel-border);
    border-radius:12px; padding:5px; margin-bottom:16px; overflow-x:auto;
  }
  nav.tabs button{
    flex:1 0 auto; background:transparent; border:none; border-radius:8px;
    color:var(--muted); font-family:'JetBrains Mono', monospace;
    font-size:11.5px; font-weight:500; padding:9px 9px; cursor:pointer;
    transition:background .15s, color .15s; white-space:nowrap;
  }
  nav.tabs button.active{ background:var(--mint); color:#04231a; font-weight:700; }
  nav.tabs button:hover:not(.active){ color:var(--text); }
  .page{ display:none; }
  .page.active{ display:block; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="eyebrow">Danh mục cá nhân</div>
      <h1>Portfolio Tracker</h1>
      <div class="updated" id="updated">Đang tải…</div>
    </header>

    <nav class="tabs" id="pageTabs">
      <button type="button" data-page="overview" class="active">01 · Tổng quan</button>
      <button type="button" data-page="pnl">03 · P&amp;L</button>
      <button type="button" data-page="allocation">04 · Phân bổ</button>
      <button type="button" data-page="contribution">05 · Đóng góp</button>
      <button type="button" data-page="drawdown">06 · Drawdown</button>
      <button type="button" data-page="risk">07 · Rủi ro</button>
      <button type="button" data-page="table">Bảng dữ liệu</button>
    </nav>

    <div id="page-overview" class="page active"></div>
    <div id="page-pnl" class="page"></div>
    <div id="page-allocation" class="page"></div>
    <div id="page-contribution" class="page"></div>
    <div id="page-drawdown" class="page"></div>
    <div id="page-risk" class="page"></div>
    <div id="page-table" class="page"></div>

    <footer>Tự động cập nhật qua GitHub Actions · dữ liệu từ data/data.json</footer>
  </div>

<script>
let DATA = null;

async function loadData() {
  try {
    const res = await fetch('data/data.json?_=' + Date.now());
    if (!res.ok) throw new Error('not found');
    const json = await res.json();
    DATA = json;
    render(json);
  } catch (e) {
    document.getElementById('pageTabs').style.display = 'none';
    document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
    const ov = document.getElementById('page-overview');
    ov.style.display = 'block';
    ov.classList.add('active');
    ov.innerHTML = `
      <div class="empty">
        Chưa có dữ liệu.<br><br>
        Chạy workflow lần đầu (tab <b>Actions</b> → <b>Update Portfolio</b> → <b>Run workflow</b>)
        để tạo file <code>data/data.json</code>.
      </div>`;
    document.getElementById('updated').textContent = '';
  }
}

function fmtVND(n) {
  if (n === null || n === undefined) return '—';
  return new Intl.NumberFormat('vi-VN').format(Math.round(n)) + ' đ';
}
function fmtVNDSigned(n) {
  if (n === null || n === undefined) return '—';
  const s = new Intl.NumberFormat('vi-VN').format(Math.round(Math.abs(n))) + ' đ';
  return (n >= 0 ? '+' : '−') + s;
}
function fmtPct(n) {
  if (n === null || n === undefined) return '—';
  const v = (n * 100).toFixed(2) + '%';
  return (n >= 0 ? '+' : '') + v;
}
function fmtPctPlain(n) {
  if (n === null || n === undefined) return '—';
  return (n * 100).toFixed(1) + '%';
}
function cls(n) { return (n === null || n === undefined) ? '' : (n >= 0 ? 'pos' : 'neg'); }

function periodOptions(selected) {
  const years = (DATA.available_years || []).slice().sort((a, b) => b - a);
  let opts = `<option value="ALL" ${selected === 'ALL' ? 'selected' : ''}>Tổng lịch sử</option>`;
  years.forEach(y => { opts += `<option value="${y}" ${selected === y ? 'selected' : ''}>${y}</option>`; });
  return opts;
}

function render(json) {
  const s = json.summary || {};
  const hist = json.history || [];

  document.getElementById('updated').textContent =
    'Cập nhật lúc ' + (s.last_updated || '—');

  renderOverview('ALL');
  renderPnl('ALL');
  renderAllocation();
  renderContribution();
  renderDrawdown();
  renderRisk('ALL');

  document.getElementById('page-table').innerHTML = `
    <div class="table-panel">
      <div class="table-title">
        <span>Bảng dữ liệu chi tiết (${hist.length} phiên)</span>
        <span class="table-hint">Cuộn để xem thêm · ô giống nhau theo tháng/năm được gộp</span>
      </div>
      <div class="table-scroll" id="dataTableWrap"></div>
    </div>
  `;

  buildTable(hist);
  initPageTabs();

  try {
    initChart(hist, json.transactions_markers || []);
  } catch (e) {
    console.error('Không vẽ được biểu đồ:', e);
    const panel = document.querySelector('#chartContainer');
    if (panel) {
      panel.parentElement.innerHTML = '<div style="padding:20px 4px;color:var(--muted);font-size:12px;">Không tải được thư viện biểu đồ. Các số liệu khác vẫn hiển thị bình thường ở trên.</div>';
    }
  }

  try {
    initDrawdownChart(json.drawdown_series || []);
  } catch (e) {
    console.error('Không vẽ được biểu đồ drawdown:', e);
  }
}

// ── 01 · TỔNG QUAN (+ 02 chart) ──────────────────────────────────────────────
function renderOverview(period) {
  const p = (DATA.periods || {})[period] || {};
  const crClass = cls(p.return_pct);

  document.getElementById('page-overview').innerHTML = `
    <div class="period-row">
      <select class="period-select" id="ovPeriod" onchange="renderOverview(this.value)">
        ${periodOptions(period)}
      </select>
    </div>

    <div class="hero">
      <div class="hero-value">${fmtVND(p.portfolio_value)}</div>
      <div class="hero-sub">
        <div class="pill ${crClass}">
          <span class="lbl">Return</span> ${fmtPct(p.return_pct)}
        </div>
        <div class="pill">
          <span class="lbl">VNINDEX</span> ${fmtPct(p.vni_return_pct)}
        </div>
      </div>
    </div>

    <div class="grid">
      <div class="stat">
        <div class="lbl">Vốn đầu tư</div>
        <div class="val">${fmtVND(p.invested_capital)}</div>
      </div>
      <div class="stat">
        <div class="lbl">P&amp;L</div>
        <div class="val ${cls(p.pnl_total)}">${fmtVNDSigned(p.pnl_total)}</div>
      </div>
      <div class="stat">
        <div class="lbl">XIRR</div>
        <div class="val ${cls(p.xirr)}">${fmtPct(p.xirr)}</div>
      </div>
      <div class="stat">
        <div class="lbl">Sharpe ratio</div>
        <div class="val">${p.sharpe != null ? p.sharpe.toFixed(2) : '—'}</div>
      </div>
      <div class="stat">
        <div class="lbl">Alpha</div>
        <div class="val ${cls(p.alpha)}">${fmtPct(p.alpha)}</div>
      </div>
      <div class="stat">
        <div class="lbl">Beta</div>
        <div class="val">${p.beta != null ? p.beta.toFixed(2) : '—'}</div>
      </div>
      <div class="stat">
        <div class="lbl">Volatility</div>
        <div class="val">${fmtPctPlain(p.volatility)}</div>
      </div>
      <div class="stat">
        <div class="lbl">Max drawdown</div>
        <div class="val neg">${fmtPct(p.max_drawdown)}</div>
      </div>
    </div>

    <div class="chart-panel">
      <div class="chart-title">
        <span>Biểu đồ hiệu suất</span>
        <span class="legend" id="chartLegend">
          <span><span class="dot" style="background:var(--mint)"></span>Danh mục</span>
          <span id="vniLegendItem"><span class="dot" style="background:var(--line-vni)"></span>VNINDEX</span>
          <span><span class="dot" style="background:var(--mint)"></span>BUY</span>
          <span><span class="dot" style="background:var(--coral)"></span>SELL</span>
        </span>
      </div>
      <div class="chart-controls">
        <div class="seg" id="metricSeg">
          <button data-v="value" class="active" type="button">Giá trị (đ)</button>
          <button data-v="pct" type="button">% Return</button>
        </div>
        <div class="seg" id="typeSeg">
          <button data-v="candle" class="active" type="button">Nến</button>
          <button data-v="line" type="button">Đường</button>
        </div>
        <div class="seg" id="tfSeg">
          <button data-v="D" class="active" type="button">Ngày</button>
          <button data-v="W" type="button">Tuần</button>
          <button data-v="M" type="button">Tháng</button>
        </div>
        <div class="seg" id="rangeSeg">
          <button data-v="1M" type="button">1T</button>
          <button data-v="3M" type="button">3T</button>
          <button data-v="6M" type="button">6T</button>
          <button data-v="1Y" type="button">1N</button>
          <button data-v="ALL" class="active" type="button">Tất cả</button>
        </div>
      </div>
      <div class="chart-wrap">
        <div id="chartContainer"></div>
        <div class="chart-tooltip" id="chartTooltip"></div>
      </div>
    </div>
  `;
}

// ── 03 · P&L ─────────────────────────────────────────────────────────────────
function renderPnl(period) {
  const p = (DATA.periods || {})[period] || {};
  document.getElementById('page-pnl').innerHTML = `
    <div class="period-row">
      <select class="period-select" id="pnlPeriod" onchange="renderPnl(this.value)">
        ${periodOptions(period)}
      </select>
    </div>
    <div class="grid cols-3">
      <div class="stat">
        <div class="lbl">Realized P&amp;L</div>
        <div class="val ${cls(p.pnl_realized)}">${fmtVNDSigned(p.pnl_realized)}</div>
      </div>
      <div class="stat">
        <div class="lbl">Unrealized P&amp;L</div>
        <div class="val ${cls(p.pnl_unrealized)}">${fmtVNDSigned(p.pnl_unrealized)}</div>
      </div>
      <div class="stat">
        <div class="lbl">Total P&amp;L</div>
        <div class="val ${cls(p.pnl_total)}">${fmtVNDSigned(p.pnl_total)}</div>
      </div>
    </div>
    <div class="stat" style="margin-bottom:16px;">
      <div class="lbl">Ghi chú</div>
      <div class="sub" style="margin-top:6px; line-height:1.6;">
        Realized P&amp;L: lãi/lỗ đã chốt (khớp lệnh SELL theo FIFO với các lô BUY trước đó).<br>
        Unrealized P&amp;L: chênh lệch giữa giá trị thị trường hiện tại và giá vốn của các mã đang nắm giữ, phát sinh trong kỳ đã chọn.
      </div>
    </div>
  `;
}

// ── 04 · ALLOCATION ──────────────────────────────────────────────────────────
function renderAllocation() {
  const positions = DATA.positions || [];
  const sectors = DATA.sector_allocation || [];

  const posRows = positions.map(p => `
    <div class="alloc-row">
      <div class="alloc-name">${p.symbol}</div>

const TABLE_COLS = [
  { key: 'date',         label: 'date',          cls: '',        fmt: v => fmtDate(v) },
  { key: 'HPG',          label: 'HPG',           cls: 'g-price',  fmt: v => fmtNum(v, 0) },
  { key: 'TCB',          label: 'TCB',           cls: 'g-price',  fmt: v => fmtNum(v, 0) },
  { key: 'FPT',          label: 'FPT',           cls: 'g-price',  fmt: v => fmtNum(v, 0) },
  { key: 'PNJ',          label: 'PNJ',           cls: 'g-price',  fmt: v => fmtNum(v, 0) },
  { key: 'FRT',          label: 'FRT',           cls: 'g-cyan',   fmt: v => fmtNum(v, 0) },
  { key: 'MWG',          label: 'MWG',           cls: 'g-cyan',   fmt: v => fmtNum(v, 0) },
  { key: 'MBB',          label: 'MBB',           cls: 'g-cyan',   fmt: v => fmtNum(v, 0) },
  { key: 'VNINDEX',      label: 'VNINDEX',       cls: 'g-vni',    fmt: v => fmtNum(v, 2) },
  { key: 'E1',           label: 'E1',            cls: 'g-cash',   fmt: v => fmtNum(v, 0) },
  { key: 'W',            label: 'W',             cls: 'g-cash',   fmt: v => fmtNum(v, 0) },
  { key: 'E0',           label: 'E0',            cls: 'g-cash',   fmt: v => fmtNum(v, 0) },
  { key: 'D',            label: 'D',             cls: 'g-cash',   fmt: v => fmtNum(v, 0) },
  { key: 'DR',           label: 'DR',            cls: 'g-stat',   fmt: v => fmtPct(v) },
  { key: 'DR(VNI)',      label: 'DR(VNI)',       cls: 'g-stat',   fmt: v => fmtPct(v) },
  { key: 'CR',           label: 'CR',            cls: 'g-stat',   fmt: v => fmtPct(v) },
  { key: 'MR',           label: 'MR',            cls: 'g-stat',   fmt: v => fmtPct(v),  merge: true },
  { key: 'YR',           label: 'YR',            cls: 'g-stat',   fmt: v => fmtPct(v),  merge: true },
  { key: 'YR(VNI)',      label: 'YR(VNI)',       cls: 'g-stat',   fmt: v => fmtPct(v),  merge: true },
  { key: 'Sharpe',       label: 'Sharpe ratio',  cls: 'g-stat',   fmt: v => fmtNum(v, 2), merge: true },
  { key: 'MaxDrawdown',  label: 'Max drawdown',  cls: 'g-stat',   fmt: v => fmtPct(v),  merge: true },
];

function fmtNum(n, decimals) {
  if (n === null || n === undefined || Number.isNaN(n)) return '—';
  return new Intl.NumberFormat('vi-VN', { minimumFractionDigits: decimals, maximumFractionDigits: decimals }).format(n);
}
function fmtDate(s) {
  if (!s) return '—';
  const [y, m, d] = s.split('-');
  return `${d}/${m}/${y}`;
}

// Với mỗi cột "merge", tính rowSpan cho ô đầu mỗi đoạn giá trị liên tiếp giống nhau.
// Cell thuộc đoạn (không phải ô đầu) sẽ có rowSpan = 0, nghĩa là bỏ qua khi render.
function computeRowSpans(rows, key) {
  const n = rows.length;
  const spans = new Array(n).fill(1);
  let i = 0;
  while (i < n) {
    let j = i;
    const v = rows[i][key];
    while (j + 1 < n && rows[j + 1][key] === v) j++;
    spans[i] = j - i + 1;
    for (let k = i + 1; k <= j; k++) spans[k] = 0;
    i = j + 1;
  }
  return spans;
}

function buildTable(hist) {
  const wrap = document.getElementById('dataTableWrap');
  if (!wrap) return;
  if (!hist.length) { wrap.innerHTML = ''; return; }

  // Mới nhất lên trên
  const rows = [...hist].reverse();

  const rowSpanMap = {};
  TABLE_COLS.forEach(col => {
    if (col.merge) rowSpanMap[col.key] = computeRowSpans(rows, col.key);
  });

  const thead = `<thead><tr>${TABLE_COLS.map(c =>
    `<th class="${c.key === 'date' ? 'dt-date' : c.cls}">${c.label}</th>`
  ).join('')}</tr></thead>`;

  const bodyRows = rows.map((r, i) => {
    const cells = TABLE_COLS.map(c => {
      if (c.merge) {
        const span = rowSpanMap[c.key][i];
        if (span === 0) return '';
        const rs = span > 1 ? ` rowspan="${span}"` : '';
        return `<td class="${c.cls}"${rs}>${c.fmt(r[c.key])}</td>`;
      }
      const cls = c.key === 'date' ? 'dt-date' : c.cls;
      return `<td class="${cls}">${c.fmt(r[c.key])}</td>`;
    }).join('');
    return `<tr>${cells}</tr>`;
  }).join('');

  wrap.innerHTML = `<table class="dtable">${thead}<tbody>${bodyRows}</tbody></table>`;
}

// ── CHART (TradingView Lightweight Charts) ─────────────────────────────────
function initChart(hist, markers) {
  if (typeof LightweightCharts === 'undefined' || !hist.length) return;

  // 1. Chuẩn hoá dữ liệu ngày: giá trị danh mục (VNĐ) và % lợi nhuận tích luỹ
  const daily = hist.map(r => ({
    date: r.date,
    value: r.E1 ?? 0,
    pct: (r.CR ?? 0) * 100,
    vniPct: (r['CR(VNI)'] ?? 0) * 100,
  }));

  // Gộp các giao dịch BUY/SELL theo ngày (1 ngày có thể có nhiều lệnh)
  const markersByDate = new Map();
  (markers || []).forEach(m => {
    if (!markersByDate.has(m.date)) markersByDate.set(m.date, []);
    markersByDate.get(m.date).push(m);
  });

  // 2. Dựng nến kiểu "close-to-close": open = giá đóng phiên trước đó
  //    (data.json chỉ lưu giá trị cuối ngày, không có OHLC thật trong ngày)
  function toOHLC(key) {
    let prev = null;
    return daily.map(d => {
      const close = d[key];
      const open = prev === null ? close : prev;
      prev = close;
      return { time: d.date, open, high: Math.max(open, close), low: Math.min(open, close), close };
    });
  }
  const dailyOHLC = { value: toOHLC('value'), pct: toOHLC('pct') };
  const dailyVniOHLC = toOHLC('vniPct');

  function periodKey(dateStr, tf) {
    if (tf === 'D') return dateStr;
    const d = new Date(dateStr + 'T00:00:00');
    if (tf === 'M') return dateStr.slice(0, 7) + '-01';
    const dow = (d.getDay() + 6) % 7; // 0 = thứ 2
    const monday = new Date(d);
    monday.setDate(d.getDate() - dow);
    return monday.toISOString().slice(0, 10);
  }

  function aggregate(ohlc, tf) {
    if (tf === 'D') return ohlc;
    const groups = new Map();
    for (const c of ohlc) {
      const key = periodKey(c.time, tf);
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(c);
    }
    const out = [];
    for (const [key, arr] of groups) {
      out.push({
        time: key,
        open: arr[0].open,
        close: arr[arr.length - 1].close,
        high: Math.max(...arr.map(x => x.high)),
        low: Math.min(...arr.map(x => x.low)),
      });
    }
    out.sort((a, b) => a.time.localeCompare(b.time));
    return out;
  }

  const container = document.getElementById('chartContainer');
  const tooltip = document.getElementById('chartTooltip');
  const vniLegendItem = document.getElementById('vniLegendItem');

  const chart = LightweightCharts.createChart(container, {
    autoSize: true,
    layout: { background: { color: 'transparent' }, textColor: '#7c8b9a', fontFamily: "'JetBrains Mono', monospace", fontSize: 10 },
    grid: { vertLines: { color: '#1e2630' }, horzLines: { color: '#1e2630' } },
    rightPriceScale: { borderColor: '#1e2630' },
    timeScale: { borderColor: '#1e2630', timeVisible: false, rightOffset: 3 },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    handleScroll: true,
    handleScale: true,
  });

  const candleSeries = chart.addCandlestickSeries({
    upColor: '#3ddc97', downColor: '#f8615a', borderVisible: false,
    wickUpColor: '#3ddc97', wickDownColor: '#f8615a',
  });
  const lineSeries = chart.addLineSeries({ color: '#3ddc97', lineWidth: 2 });
  const vniSeries = chart.addLineSeries({ color: '#7a8ea3', lineWidth: 1.5 });

  const state = { metric: 'value', type: 'candle', tf: 'D', range: 'ALL' };

  function currentData() {
    const src = state.metric === 'value' ? dailyOHLC.value : dailyOHLC.pct;
    return aggregate(src, state.tf);
  }
  function currentVniData() {
    return aggregate(dailyVniOHLC, state.tf);
  }

  function applyRange() {
    const times = lastRenderedTimes;
    if (!times || !times.length) return;
    if (state.range === 'ALL') { chart.timeScale().fitContent(); return; }
    const days = { '1M': 30, '3M': 90, '6M': 182, '1Y': 365 }[state.range];
    const to = times[times.length - 1];
    const fromDate = new Date(to + 'T00:00:00');
    fromDate.setDate(fromDate.getDate() - days);
    const from = fromDate.toISOString().slice(0, 10);
    try {
      chart.timeScale().setVisibleRange({ from, to });
    } catch (e) { chart.timeScale().fitContent(); }
  }

  let lastRenderedTimes = [];

  function rebuild() {
    const ohlc = currentData();
    lastRenderedTimes = ohlc.map(c => c.time);
    const showCandle = state.type === 'candle';
    const showVni = !showCandle && state.metric === 'pct';

    candleSeries.applyOptions({ visible: showCandle });
    lineSeries.applyOptions({ visible: !showCandle });
    vniSeries.applyOptions({ visible: showVni });
    vniLegendItem.style.display = showVni ? 'flex' : 'none';

    if (showCandle) {
      candleSeries.setData(ohlc);
    } else {
      lineSeries.setData(ohlc.map(c => ({ time: c.time, value: c.close })));
      if (showVni) {
        vniSeries.setData(currentVniData().map(c => ({ time: c.time, value: c.close })));
      }
    }

    candleSeries.applyOptions({
      priceFormat: state.metric === 'value'
        ? { type: 'custom', formatter: v => new Intl.NumberFormat('vi-VN').format(Math.round(v)) }
        : { type: 'custom', formatter: v => v.toFixed(2) + '%' },
    });
    lineSeries.applyOptions({ priceFormat: candleSeries.options().priceFormat });

    // BUY/SELL markers — chỉ hiện ở khung Ngày (D), vì gộp theo Tuần/Tháng làm mất ý nghĩa ngày khớp lệnh
    const activeSeries = showCandle ? candleSeries : lineSeries;
    if (state.tf === 'D' && markersByDate.size) {
      const chartMarkers = [];
      for (const [date, txs] of markersByDate) {
        const hasBuy = txs.some(t => t.action === 'BUY');
        const hasSell = txs.some(t => t.action === 'SELL');
        if (hasBuy) {
          chartMarkers.push({ time: date, position: 'belowBar', color: '#3ddc97', shape: 'circle', text: 'B' });
        }
        if (hasSell) {
          chartMarkers.push({ time: date, position: 'aboveBar', color: '#f8615a', shape: 'circle', text: 'S' });
        }
      }
      chartMarkers.sort((a, b) => a.time.localeCompare(b.time));
      activeSeries.setMarkers(chartMarkers);
    } else {
      activeSeries.setMarkers([]);
    }
    (showCandle ? lineSeries : candleSeries).setMarkers([]);

    applyRange();
  }

  // ── Điều khiển segment (Giá trị/%, Nến/Đường, Ngày/Tuần/Tháng, khoảng thời gian) ──
  function wireSeg(id, stateKey) {
    const seg = document.getElementById(id);
    seg.addEventListener('click', e => {
      const btn = e.target.closest('button');
      if (!btn) return;
      seg.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state[stateKey] = btn.dataset.v;
      rebuild();
    });
  }
  wireSeg('metricSeg', 'metric');
  wireSeg('typeSeg', 'type');
  wireSeg('tfSeg', 'tf');
  wireSeg('rangeSeg', 'range');

  // ── Crosshair: hiện giá trị + giao dịch BUY/SELL tại thời điểm đang trỏ ──
  chart.subscribeCrosshairMove(param => {
    if (!param || !param.time || !param.point) {
      tooltip.style.display = 'none';
      return;
    }
    const activeSeries = state.type === 'candle' ? candleSeries : lineSeries;
    const d = param.seriesData.get(activeSeries);
    if (!d) { tooltip.style.display = 'none'; return; }

    const isPct = state.metric === 'pct';
    const fmt = v => isPct ? (v >= 0 ? '+' : '') + v.toFixed(2) + '%' : fmtVND(v);

    let rows = '';
    if (state.type === 'candle') {
      const dir = d.close >= d.open ? 'tt-up' : 'tt-down';
      rows = `
        <div class="tt-row"><span class="tt-lbl">Mở</span><span>${fmt(d.open)}</span></div>
        <div class="tt-row"><span class="tt-lbl">Cao</span><span>${fmt(d.high)}</span></div>
        <div class="tt-row"><span class="tt-lbl">Thấp</span><span>${fmt(d.low)}</span></div>
        <div class="tt-row"><span class="tt-lbl">Đóng</span><span class="${dir}">${fmt(d.close)}</span></div>`;
    } else {
      rows = `<div class="tt-row"><span class="tt-lbl">Danh mục</span><span>${fmt(d.value)}</span></div>`;
      const vd = param.seriesData.get(vniSeries);
      if (vd && vniSeries.options().visible) {
        rows += `<div class="tt-row"><span class="tt-lbl">VNINDEX</span><span>${(vd.value >= 0 ? '+' : '') + vd.value.toFixed(2)}%</span></div>`;
      }
    }

    // Thông tin giao dịch BUY/SELL trong ngày đang trỏ (chỉ ở khung Ngày)
    let txHtml = '';
    if (state.tf === 'D') {
      const txs = markersByDate.get(param.time);
      if (txs && txs.length) {
        txHtml += '<div class="tt-sep"></div>';
        txs.forEach(t => {
          const head = `${t.action} · ${t.symbol}`;
          txHtml += `<div class="tt-tx">
            <div class="tt-tx-head ${t.action === 'BUY' ? 'buy' : 'sell'}">${head}</div>
            <div class="tt-row"><span class="tt-lbl">Giá</span><span>${fmtVND(t.price)}</span></div>
            <div class="tt-row"><span class="tt-lbl">Khối lượng</span><span>${fmtNum(t.quantity, 0)}</span></div>
            <div class="tt-row"><span class="tt-lbl">Giá trị</span><span>${fmtVND(t.value)}</span></div>
            ${t.action === 'SELL' ? `<div class="tt-row"><span class="tt-lbl">Realized P&amp;L</span><span class="${t.realized_pnl >= 0 ? 'tt-up' : 'tt-down'}">${fmtVNDSigned(t.realized_pnl)}</span></div>` : ''}
          </div>`;
        });
      }
    }

    tooltip.innerHTML = `<div class="tt-date">${param.time}</div>${rows}${txHtml}`;
    tooltip.style.display = 'block';

    const cw = container.clientWidth;
    const tw = 220;
    let left = param.point.x + 14;
    if (left + tw > cw) left = param.point.x - tw - 14;
    tooltip.style.left = Math.max(4, left) + 'px';
    tooltip.style.top = '6px';
  });

  rebuild();
}

// ── 06 · CHART DRAWDOWN (area, toàn bộ lịch sử) ──────────────────────────────
function initDrawdownChart(series) {
  const container = document.getElementById('ddChartContainer');
  const tooltip = document.getElementById('ddChartTooltip');
  if (!container || typeof LightweightCharts === 'undefined' || !series.length) return;

  const chart = LightweightCharts.createChart(container, {
    autoSize: true,
    layout: { background: { color: 'transparent' }, textColor: '#7c8b9a', fontFamily: "'JetBrains Mono', monospace", fontSize: 10 },
    grid: { vertLines: { color: '#1e2630' }, horzLines: { color: '#1e2630' } },
    rightPriceScale: { borderColor: '#1e2630' },
    timeScale: { borderColor: '#1e2630', rightOffset: 3 },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    handleScroll: true,
    handleScale: true,
  });

  const areaSeries = chart.addAreaSeries({
    lineColor: '#f8615a', topColor: 'rgba(248,97,90,0.35)', bottomColor: 'rgba(248,97,90,0.02)',
    lineWidth: 2,
    priceFormat: { type: 'custom', formatter: v => (v * 100).toFixed(2) + '%' },
  });
  areaSeries.setData(series.map(d => ({ time: d.date, value: d.drawdown })));
  chart.timeScale().fitContent();

  chart.subscribeCrosshairMove(param => {
    if (!param || !param.time || !param.point) { tooltip.style.display = 'none'; return; }
    const d = param.seriesData.get(areaSeries);
    if (!d) { tooltip.style.display = 'none'; return; }
    tooltip.innerHTML = `<div class="tt-date">${param.time}</div>
      <div class="tt-row"><span class="tt-lbl">Drawdown</span><span class="tt-down">${(d.value * 100).toFixed(2)}%</span></div>`;
    tooltip.style.display = 'block';
    const cw = container.clientWidth;
    const tw = 160;
    let left = param.point.x + 14;
    if (left + tw > cw) left = param.point.x - tw - 14;
    tooltip.style.left = Math.max(4, left) + 'px';
    tooltip.style.top = '6px';
  });
}

// ── ĐIỀU HƯỚNG TRANG ─────────────────────────────────────────────────────────
function initPageTabs() {
  const tabs = document.getElementById('pageTabs');
  if (!tabs || tabs.dataset.wired) return; // chỉ gắn sự kiện 1 lần
  tabs.dataset.wired = '1';

  const PAGES = ['overview', 'pnl', 'allocation', 'contribution', 'drawdown', 'risk', 'table'];

  function showPage(name) {
    if (!PAGES.includes(name)) name = 'overview';
    tabs.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.page === name));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    const el = document.getElementById('page-' + name);
    if (el) el.classList.add('active');
    // Biểu đồ dùng canvas: cần resize lại khi panel vừa được hiện ra
    if (name === 'overview' || name === 'drawdown') window.dispatchEvent(new Event('resize'));
  }

  tabs.addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const name = btn.dataset.page;
    if (location.hash !== '#' + name) location.hash = name;
    else showPage(name);
  });

  window.addEventListener('hashchange', () => {
    showPage(location.hash.replace('#', '') || 'overview');
  });

  // Mở đúng trang theo hash lúc tải trang (cho phép link thẳng tới #pnl, #allocation, ...)
  showPage(location.hash.replace('#', ''));
}

loadData();
</script>
</body>
</html>
