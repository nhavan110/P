<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
  if (typeof LightweightCharts === 'undefined') {
    document.write('<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"><\/script>');
  }
</script>
<style>
  :root{
    --bg:#0a0e12;
    --panel:#11161c;
    --panel-border:#1e2630;
    --text:#e7ecf1;
    --muted:#7c8b9a;
    --mint:#3ddc97;
    --coral:#f8615a;
    --amber:#f0b64c;
    --line-vni:#7a8ea3;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'JetBrains Mono', monospace;
    min-height:100vh;
    padding:20px 16px 60px;
  }
  .wrap{max-width:760px; margin:0 auto;}

  header{margin-bottom:28px;}
  .eyebrow{
    font-size:11px; letter-spacing:0.16em; text-transform:uppercase;
    color:var(--muted); margin-bottom:6px;
  }
  h1{
    font-family:'Space Grotesk', sans-serif;
    font-size:22px; font-weight:700; letter-spacing:-0.01em;
  }
  .updated{font-size:11px; color:var(--muted); margin-top:4px;}

  .hero{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:14px;
    padding:24px 20px;
    margin-bottom:16px;
  }
  .hero-value{
    font-family:'Space Grotesk', sans-serif;
    font-size:38px; font-weight:700; letter-spacing:-0.01em;
    line-height:1.1;
  }
  .hero-sub{
    display:flex; gap:18px; margin-top:14px; flex-wrap:wrap;
  }
  .pill{
    font-size:13px; font-weight:500;
    display:flex; align-items:center; gap:6px;
  }
  .pill .lbl{color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:0.08em;}
  .pos{color:var(--mint);}
  .neg{color:var(--coral);}

  .grid{
    display:grid; grid-template-columns:repeat(2, 1fr); gap:10px;
    margin-bottom:16px;
  }
  .stat{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:12px;
    padding:14px 16px;
  }
  .stat .lbl{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:6px;}
  .stat .val{font-size:19px; font-weight:700; font-family:'Space Grotesk', sans-serif;}

  .chart-panel{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:14px;
    padding:18px 14px 14px;
    margin-bottom:16px;
  }
  .chart-title{
    font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.1em;
    margin-bottom:12px; padding:0 4px;
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;
  }
  .legend{display:flex; gap:14px; font-size:11px; text-transform:none; letter-spacing:0;}
  .legend span{display:flex; align-items:center; gap:5px;}
  .dot{width:8px; height:8px; border-radius:50%; display:inline-block;}

  .chart-controls{
    display:flex; flex-wrap:wrap; gap:8px;
    margin-bottom:12px; padding:0 4px;
  }
  .seg{
    display:flex; background:var(--bg); border:1px solid var(--panel-border);
    border-radius:8px; overflow:hidden;
  }
  .seg button{
    background:transparent; border:none; color:var(--muted);
    font-family:'JetBrains Mono', monospace; font-size:11px; font-weight:500;
    padding:6px 11px; cursor:pointer; transition:background .15s, color .15s;
    border-right:1px solid var(--panel-border);
    white-space:nowrap;
  }
  .seg button:last-child{border-right:none;}
  .seg button.active{background:var(--mint); color:#04231a; font-weight:700;}
  .seg button:hover:not(.active){color:var(--text);}

  .chart-wrap{position:relative;}
  #chartContainer{width:100%; height:280px;}

  .chart-tooltip{
    position:absolute; top:6px; left:6px; pointer-events:none;
    background:rgba(10,14,18,0.92); border:1px solid var(--panel-border);
    border-radius:8px; padding:8px 10px; font-size:11px; line-height:1.6;
    color:var(--text); display:none; z-index:5; white-space:nowrap;
  }
  .chart-tooltip .tt-date{color:var(--muted); margin-bottom:3px; font-size:10px; text-transform:uppercase; letter-spacing:0.05em;}
  .chart-tooltip .tt-row{display:flex; gap:8px; justify-content:space-between;}
  .chart-tooltip .tt-row .tt-lbl{color:var(--muted);}
  .chart-tooltip .tt-up{color:var(--mint);}
  .chart-tooltip .tt-down{color:var(--coral);}

  .empty{
    text-align:center; padding:60px 20px; color:var(--muted); font-size:13px; line-height:1.6;
  }
  .empty code{
    background:var(--panel); padding:2px 6px; border-radius:4px; color:var(--amber);
  }

  footer{
    text-align:center; margin-top:24px; font-size:10px; color:var(--muted);
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="eyebrow">Danh mục cá nhân</div>
      <h1>Portfolio Tracker</h1>
      <div class="updated" id="updated">Đang tải…</div>
    </header>

    <div id="content"></div>

    <footer>Tự động cập nhật qua GitHub Actions · dữ liệu từ data/data.json</footer>
  </div>

<script>
async function loadData() {
  try {
    const res = await fetch('data/data.json?_=' + Date.now());
    if (!res.ok) throw new Error('not found');
    const json = await res.json();
    render(json);
  } catch (e) {
    document.getElementById('content').innerHTML = `
      <div class="empty">
        Chưa có dữ liệu.<br><br>
        Chạy workflow lần đầu (tab <b>Actions</b> → <b>Update Portfolio</b> → <b>Run workflow</b>)
        để tạo file <code>data/data.json</code>.
      </div>`;
    document.getElementById('updated').textContent = '';
  }
}

function fmtVND(n) {
  return new Intl.NumberFormat('vi-VN').format(Math.round(n)) + ' đ';
}
function fmtPct(n) {
  const v = (n * 100).toFixed(2) + '%';
  return (n >= 0 ? '+' : '') + v;
}

function render(json) {
  const s = json.summary || {};
  const hist = json.history || [];

  document.getElementById('updated').textContent =
    'Cập nhật lúc ' + (s.last_updated || '—');

  const crClass = (s.cumulative_return ?? 0) >= 0 ? 'pos' : 'neg';

  document.getElementById('content').innerHTML = `
    <div class="hero">
      <div class="hero-value">${fmtVND(s.portfolio_value ?? 0)}</div>
      <div class="hero-sub">
        <div class="pill ${crClass}">
          <span class="lbl">Lợi nhuận tích luỹ</span> ${fmtPct(s.cumulative_return ?? 0)}
        </div>
        <div class="pill">
          <span class="lbl">VNINDEX</span> ${fmtPct(s.cumulative_return_vni ?? 0)}
        </div>
      </div>
    </div>

    <div class="grid">
      <div class="stat">
        <div class="lbl">Sharpe ratio</div>
        <div class="val">${s.sharpe_ratio != null ? s.sharpe_ratio.toFixed(2) : '—'}</div>
      </div>
      <div class="stat">
        <div class="lbl">Max drawdown</div>
        <div class="val neg">${s.max_drawdown != null ? fmtPct(s.max_drawdown) : '—'}</div>
      </div>
    </div>

    <div class="chart-panel">
      <div class="chart-title">
        <span>Biểu đồ hiệu suất</span>
        <span class="legend" id="chartLegend">
          <span><span class="dot" style="background:var(--mint)"></span>Danh mục</span>
          <span id="vniLegendItem"><span class="dot" style="background:var(--line-vni)"></span>VNINDEX</span>
        </span>
      </div>
      <div class="chart-controls">
        <div class="seg" id="metricSeg">
          <button data-v="value" class="active" type="button">Giá trị (đ)</button>
          <button data-v="pct" type="button">% Lợi nhuận</button>
        </div>
        <div class="seg" id="typeSeg">
          <button data-v="candle" class="active" type="button">Nến</button>
          <button data-v="line" type="button">Đường</button>
        </div>
        <div class="seg" id="tfSeg">
          <button data-v="D" class="active" type="button">Ngày</button>
          <button data-v="W" type="button">Tuần</button>
          <button data-v="M" type="button">Tháng</button>
        </div>
        <div class="seg" id="rangeSeg">
          <button data-v="1M" type="button">1T</button>
          <button data-v="3M" type="button">3T</button>
          <button data-v="6M" type="button">6T</button>
          <button data-v="1Y" type="button">1N</button>
          <button data-v="ALL" class="active" type="button">Tất cả</button>
        </div>
      </div>
      <div class="chart-wrap">
        <div id="chartContainer"></div>
        <div class="chart-tooltip" id="chartTooltip"></div>
      </div>
    </div>
  `;

  try {
    initChart(hist);
  } catch (e) {
    console.error('Không vẽ được biểu đồ:', e);
    const panel = document.querySelector('.chart-panel .chart-wrap');
    if (panel) {
      panel.innerHTML = '<div style="padding:20px 4px;color:var(--muted);font-size:12px;">Không tải được thư viện biểu đồ. Các số liệu khác vẫn hiển thị bình thường ở trên.</div>';
    }
  }
}

// ── CHART (TradingView Lightweight Charts) ─────────────────────────────────
function initChart(hist) {
  if (typeof LightweightCharts === 'undefined' || !hist.length) return;

  // 1. Chuẩn hoá dữ liệu ngày: giá trị danh mục (VNĐ) và % lợi nhuận tích luỹ
  const daily = hist.map(r => ({
    date: r.date,
    value: r.E1 ?? 0,
    pct: (r.CR ?? 0) * 100,
    vniPct: (r['CR(VNI)'] ?? 0) * 100,
  }));

  // 2. Dựng nến kiểu "close-to-close": open = giá đóng phiên trước đó
  //    (data.json chỉ lưu giá trị cuối ngày, không có OHLC thật trong ngày)
  function toOHLC(key) {
    let prev = null;
    return daily.map(d => {
      const close = d[key];
      const open = prev === null ? close : prev;
      prev = close;
      return { time: d.date, open, high: Math.max(open, close), low: Math.min(open, close), close };
    });
  }
  const dailyOHLC = { value: toOHLC('value'), pct: toOHLC('pct') };
  const dailyVniOHLC = toOHLC('vniPct');

  function periodKey(dateStr, tf) {
    if (tf === 'D') return dateStr;
    const d = new Date(dateStr + 'T00:00:00');
    if (tf === 'M') return dateStr.slice(0, 7) + '-01';
    const dow = (d.getDay() + 6) % 7; // 0 = thứ 2
    const monday = new Date(d);
    monday.setDate(d.getDate() - dow);
    return monday.toISOString().slice(0, 10);
  }

  function aggregate(ohlc, tf) {
    if (tf === 'D') return ohlc;
    const groups = new Map();
    for (const c of ohlc) {
      const key = periodKey(c.time, tf);
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(c);
    }
    const out = [];
    for (const [key, arr] of groups) {
      out.push({
        time: key,
        open: arr[0].open,
        close: arr[arr.length - 1].close,
        high: Math.max(...arr.map(x => x.high)),
        low: Math.min(...arr.map(x => x.low)),
      });
    }
    out.sort((a, b) => a.time.localeCompare(b.time));
    return out;
  }

  const container = document.getElementById('chartContainer');
  const tooltip = document.getElementById('chartTooltip');
  const vniLegendItem = document.getElementById('vniLegendItem');

  const chart = LightweightCharts.createChart(container, {
    autoSize: true,
    layout: { background: { color: 'transparent' }, textColor: '#7c8b9a', fontFamily: "'JetBrains Mono', monospace", fontSize: 10 },
    grid: { vertLines: { color: '#1e2630' }, horzLines: { color: '#1e2630' } },
    rightPriceScale: { borderColor: '#1e2630' },
    timeScale: { borderColor: '#1e2630', timeVisible: false, rightOffset: 3 },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    handleScroll: true,
    handleScale: true,
  });

  const candleSeries = chart.addCandlestickSeries({
    upColor: '#3ddc97', downColor: '#f8615a', borderVisible: false,
    wickUpColor: '#3ddc97', wickDownColor: '#f8615a',
  });
  const lineSeries = chart.addLineSeries({ color: '#3ddc97', lineWidth: 2 });
  const vniSeries = chart.addLineSeries({ color: '#7a8ea3', lineWidth: 1.5 });

  const state = { metric: 'value', type: 'candle', tf: 'D', range: 'ALL' };

  function currentData() {
    const src = state.metric === 'value' ? dailyOHLC.value : dailyOHLC.pct;
    return aggregate(src, state.tf);
  }
  function currentVniData() {
    return aggregate(dailyVniOHLC, state.tf);
  }

  function applyRange() {
    const times = lastRenderedTimes;
    if (!times || !times.length) return;
    if (state.range === 'ALL') { chart.timeScale().fitContent(); return; }
    const days = { '1M': 30, '3M': 90, '6M': 182, '1Y': 365 }[state.range];
    const to = times[times.length - 1];
    const fromDate = new Date(to + 'T00:00:00');
    fromDate.setDate(fromDate.getDate() - days);
    const from = fromDate.toISOString().slice(0, 10);
    try {
      chart.timeScale().setVisibleRange({ from, to });
    } catch (e) { chart.timeScale().fitContent(); }
  }

  let lastRenderedTimes = [];

  function rebuild() {
    const ohlc = currentData();
    lastRenderedTimes = ohlc.map(c => c.time);
    const showCandle = state.type === 'candle';
    const showVni = !showCandle && state.metric === 'pct';

    candleSeries.applyOptions({ visible: showCandle });
    lineSeries.applyOptions({ visible: !showCandle });
    vniSeries.applyOptions({ visible: showVni });
    vniLegendItem.style.display = showVni ? 'flex' : 'none';

    if (showCandle) {
      candleSeries.setData(ohlc);
    } else {
      lineSeries.setData(ohlc.map(c => ({ time: c.time, value: c.close })));
      if (showVni) {
        vniSeries.setData(currentVniData().map(c => ({ time: c.time, value: c.close })));
      }
    }

    candleSeries.applyOptions({
      priceFormat: state.metric === 'value'
        ? { type: 'custom', formatter: v => new Intl.NumberFormat('vi-VN').format(Math.round(v)) }
        : { type: 'custom', formatter: v => v.toFixed(2) + '%' },
    });
    lineSeries.applyOptions({ priceFormat: candleSeries.options().priceFormat });

    applyRange();
  }

  // ── Điều khiển segment (Giá trị/%, Nến/Đường, Ngày/Tuần/Tháng, khoảng thời gian) ──
  function wireSeg(id, stateKey) {
    const seg = document.getElementById(id);
    seg.addEventListener('click', e => {
      const btn = e.target.closest('button');
      if (!btn) return;
      seg.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state[stateKey] = btn.dataset.v;
      rebuild();
    });
  }
  wireSeg('metricSeg', 'metric');
  wireSeg('typeSeg', 'type');
  wireSeg('tfSeg', 'tf');
  wireSeg('rangeSeg', 'range');

  // ── Crosshair: hiện giá trị tại thời điểm đang trỏ ──
  chart.subscribeCrosshairMove(param => {
    if (!param || !param.time || !param.point) {
      tooltip.style.display = 'none';
      return;
    }
    const activeSeries = state.type === 'candle' ? candleSeries : lineSeries;
    const d = param.seriesData.get(activeSeries);
    if (!d) { tooltip.style.display = 'none'; return; }

    const isPct = state.metric === 'pct';
    const fmt = v => isPct ? (v >= 0 ? '+' : '') + v.toFixed(2) + '%' : fmtVND(v);

    let rows = '';
    if (state.type === 'candle') {
      const dir = d.close >= d.open ? 'tt-up' : 'tt-down';
      rows = `
        <div class="tt-row"><span class="tt-lbl">Mở</span><span>${fmt(d.open)}</span></div>
        <div class="tt-row"><span class="tt-lbl">Cao</span><span>${fmt(d.high)}</span></div>
        <div class="tt-row"><span class="tt-lbl">Thấp</span><span>${fmt(d.low)}</span></div>
        <div class="tt-row"><span class="tt-lbl">Đóng</span><span class="${dir}">${fmt(d.close)}</span></div>`;
    } else {
      rows = `<div class="tt-row"><span class="tt-lbl">Danh mục</span><span>${fmt(d.value)}</span></div>`;
      const vd = param.seriesData.get(vniSeries);
      if (vd && vniSeries.options().visible) {
        rows += `<div class="tt-row"><span class="tt-lbl">VNINDEX</span><span>${(vd.value >= 0 ? '+' : '') + vd.value.toFixed(2)}%</span></div>`;
      }
    }
    tooltip.innerHTML = `<div class="tt-date">${param.time}</div>${rows}`;
    tooltip.style.display = 'block';

    const cw = container.clientWidth;
    const tw = 160;
    let left = param.point.x + 14;
    if (left + tw > cw) left = param.point.x - tw - 14;
    tooltip.style.left = Math.max(4, left) + 'px';
    tooltip.style.top = '6px';
  });

  rebuild();
}

loadData();
</script>
</body>
</html>
