<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
  if (typeof LightweightCharts === 'undefined') {
    document.write('<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"><\/script>');
  }
</script>
<style>
  :root{
    --bg:#0a0e12;
    --panel:#11161c;
    --panel-border:#1e2630;
    --text:#e7ecf1;
    --muted:#7c8b9a;
    --mint:#3ddc97;
    --coral:#f8615a;
    --amber:#f0b64c;
    --line-vni:#7a8ea3;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'JetBrains Mono', monospace;
    min-height:100vh;
    padding:20px 16px 60px;
  }
  .wrap{max-width:760px; margin:0 auto;}

  header{margin-bottom:28px;}
  .eyebrow{
    font-size:11px; letter-spacing:0.16em; text-transform:uppercase;
    color:var(--muted); margin-bottom:6px;
  }
  h1{
    font-family:'Space Grotesk', sans-serif;
    font-size:22px; font-weight:700; letter-spacing:-0.01em;
  }
  .updated{font-size:11px; color:var(--muted); margin-top:4px;}

  .hero{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:14px;
    padding:24px 20px;
    margin-bottom:16px;
  }
  .hero-value{
    font-family:'Space Grotesk', sans-serif;
    font-size:38px; font-weight:700; letter-spacing:-0.01em;
    line-height:1.1;
  }
  .hero-profit{
    font-size:14px; font-weight:600; margin-top:4px;
  }
  .hero-sub{
    display:flex; gap:18px; margin-top:14px; flex-wrap:wrap;
  }
  .pill{
    font-size:13px; font-weight:500;
    display:flex; align-items:center; gap:6px;
  }
  .pill .lbl{color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:0.08em;}
  .pos{color:var(--mint);}
  .neg{color:var(--coral);}

  .grid{
    display:grid; grid-template-columns:repeat(2, 1fr); gap:10px;
    margin-bottom:16px;
  }
  .stat{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:12px;
    padding:14px 16px;
  }
  .stat .lbl{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:6px;}
  .stat .val{font-size:19px; font-weight:700; font-family:'Space Grotesk', sans-serif;}

  .chart-panel{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:14px;
    padding:18px 14px 14px;
    margin-bottom:16px;
  }
  .chart-title{
    font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.1em;
    margin-bottom:12px; padding:0 4px;
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;
  }
  .legend{display:flex; gap:14px; font-size:11px; text-transform:none; letter-spacing:0;}
  .legend span{display:flex; align-items:center; gap:5px;}
  .dot{width:8px; height:8px; border-radius:50%; display:inline-block;}

  .chart-controls{
    display:flex; flex-wrap:wrap; gap:8px;
    margin-bottom:12px; padding:0 4px;
  }
  /* .year-select dùng chung cho mọi dropdown lựa chọn trong trang (khung
     thời gian biểu đồ, loại biểu đồ, kỳ xem rủi ro...) để đồng nhất giao
     diện. */
  .year-select{
    background:var(--bg); border:1px solid var(--panel-border); color:var(--text);
    font-family:'JetBrains Mono', monospace; font-size:11px; font-weight:500;
    padding:6px 10px; border-radius:8px; cursor:pointer; outline:none;
    appearance:auto;
  }
  .year-select:hover{ border-color:var(--mint); }

  .chart-wrap{position:relative;}
  #chartContainer{width:100%; height:280px;}

  .chart-tooltip{
    position:absolute; top:6px; left:6px; pointer-events:none;
    background:rgba(10,14,18,0.92); border:1px solid var(--panel-border);
    border-radius:8px; padding:8px 10px; font-size:11px; line-height:1.6;
    color:var(--text); display:none; z-index:5; white-space:nowrap;
  }
  .chart-tooltip .tt-date{color:var(--muted); margin-bottom:3px; font-size:10px; text-transform:uppercase; letter-spacing:0.05em;}
  .chart-tooltip .tt-row{display:flex; gap:8px; justify-content:space-between;}
  .chart-tooltip .tt-row .tt-lbl{color:var(--muted);}
  .chart-tooltip .tt-up{color:var(--mint);}
  .chart-tooltip .tt-down{color:var(--coral);}
  .chart-tooltip .tt-amber{color:var(--amber);}

  .empty{
    text-align:center; padding:60px 20px; color:var(--muted); font-size:13px; line-height:1.6;
  }
  .empty code{
    background:var(--panel); padding:2px 6px; border-radius:4px; color:var(--amber);
  }

  /* ── Bảng dữ liệu ── */
  .table-panel{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:14px;
    padding:18px 14px 16px;
    margin-bottom:16px;
  }
  /* #page-table nằm ngoài .wrap (là con trực tiếp của <body>, xem cấu trúc
     HTML) nên containing block của nó là body/viewport, không phải .wrap bị
     giới hạn max-width:760px — margin:0 auto vì vậy canh giữa đúng, không
     cần trộn đơn vị %/vw dễ lỗi như trước. */
  #page-table{
    max-width:1600px; width:100%;
    margin:0 auto;
    padding:0 16px;
  }
  .table-title{
    font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.1em;
    margin-bottom:12px; padding:0 4px;
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;
  }
  .table-hint{font-size:10px; color:var(--muted); text-transform:none; letter-spacing:0;}
  /* table-layout:fixed + colgroup theo % trọng số (xem TABLE_COLS/buildTable)
     để bảng LUÔN khớp đúng 100% chiều rộng khung chứa — không bao giờ tràn
     ra ngoài nên không cần cuộn ngang trên desktop. Cỡ chữ co giãn nhẹ theo
     bề rộng màn hình để chữ vẫn đọc được khi khung hẹp lại; text-overflow
     ellipsis chỉ là lưới an toàn cho màn rất hẹp (điện thoại), gần như không
     xảy ra ở màn hình máy tính. */
  .table-scroll{
    overflow-y:auto; overflow-x:hidden; max-height:560px;
    border:1px solid var(--panel-border); border-radius:10px;
  }
  table.dtable{
    table-layout:fixed; border-collapse:collapse; width:100%;
    font-size:clamp(9.5px, 0.82vw, 12px);
  }
  table.dtable th, table.dtable td{
    padding:7px 6px; text-align:right; border-bottom:1px solid var(--panel-border);
    border-right:1px solid var(--panel-border);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.3;
  }
  table.dtable th{
    position:sticky; top:0; z-index:2;
    background:#161d25; color:var(--text); font-weight:700; text-align:right;
    font-family:'Space Grotesk', sans-serif; font-size:clamp(8.5px, 0.75vw, 11px);
  }
  table.dtable td.dt-date, table.dtable th.dt-date{
    text-align:left; position:sticky; left:0; z-index:1;
    background:#0d1218;
  }
  table.dtable th.dt-date{ z-index:3; }
  table.dtable td.dt-date{ color:var(--text); font-weight:500; }
  table.dtable tbody tr:hover td{ background:#161d25; }
  table.dtable tbody tr:hover td.dt-date{ background:#1a222c; }
  table.dtable td.g-price{ background:rgba(61,220,151,0.06); }
  table.dtable td.g-cyan{ background:rgba(122,208,230,0.06); }
  table.dtable td.g-vni{ background:rgba(240,182,76,0.07); }
  table.dtable td.g-cash{ background:rgba(90,140,230,0.08); }
  table.dtable td.g-stat{ background:rgba(158,122,222,0.09); font-weight:500; }
  table.dtable th.g-price{ color:var(--mint); }
  table.dtable th.g-cyan{ color:#7ad0e6; }
  table.dtable th.g-vni{ color:var(--amber); }
  table.dtable th.g-cash{ color:#9db8f0; }
  table.dtable th.g-stat{ color:#c3aef2; }

  /* ── Bảng phân bổ danh mục (gọn, không sticky/scroll) ── */
  table.postable{
    border-collapse:collapse; width:100%; font-size:11.5px;
  }
  table.postable th, table.postable td{
    padding:7px 8px; text-align:right; border-bottom:1px solid var(--panel-border);
  }
  table.postable th{
    color:var(--muted); font-weight:700; text-align:right;
    font-family:'Space Grotesk', sans-serif; font-size:10px;
    text-transform:uppercase; letter-spacing:0.04em;
  }
  table.postable td.pt-sym, table.postable th.pt-sym{ text-align:left; color:var(--text); font-weight:700; }
  table.postable td.pt-sector, table.postable th.pt-sector{ text-align:left; color:var(--muted); font-size:10.5px; }
  table.postable tbody tr:last-child td{ border-bottom:none; }
  table.postable tbody tr:hover td{ background:#161d25; }

  footer{
    text-align:center; margin-top:24px; font-size:10px; color:var(--muted);
  }

  /* ── Tab 03 · Phân tích doanh nghiệp ── */
  #page-company{
    max-width:1600px; width:100%;
    margin:0 auto;
    padding:0 16px;
  }
  .co-crumb{
    display:flex; align-items:center; flex-wrap:wrap; gap:6px;
    font-size:11px; color:var(--muted); margin-bottom:12px; padding:0 4px;
  }
  .co-crumb button{
    background:none; border:none; color:var(--mint); cursor:pointer;
    font-family:'JetBrains Mono', monospace; font-size:11px; padding:0;
  }
  .co-crumb button:hover{ text-decoration:underline; }
  .co-crumb .sep{ color:var(--panel-border); }
  .chip-grid{
    display:flex; flex-wrap:wrap; gap:8px; margin-bottom:4px;
  }
  .chip{
    background:var(--panel); border:1px solid var(--panel-border); color:var(--text);
    font-family:'JetBrains Mono', monospace; font-size:12px; font-weight:600;
    padding:10px 16px; border-radius:10px; cursor:pointer;
    transition:border-color .15s, color .15s;
  }
  .chip:hover{ border-color:var(--mint); color:var(--mint); }
  .chip.sheet-chip{ font-weight:500; text-transform:none; }
  table.ftable{
    border-collapse:collapse; width:max-content; min-width:100%;
    font-size:clamp(9.5px, 0.8vw, 12px);
  }
  table.ftable th, table.ftable td{
    padding:7px 10px; text-align:right; border-bottom:1px solid var(--panel-border);
    border-right:1px solid var(--panel-border);
    white-space:nowrap; line-height:1.3;
  }
  table.ftable th{
    position:sticky; top:0; z-index:2;
    background:#161d25; color:var(--text); font-weight:700;
    font-family:'Space Grotesk', sans-serif; font-size:clamp(8.5px, 0.72vw, 11px);
  }
  table.ftable td.ft-label, table.ftable th.ft-label{
    text-align:left; position:sticky; left:0; z-index:1;
    background:#0d1218; min-width:220px; max-width:340px;
    white-space:normal;
  }
  table.ftable th.ft-label{ z-index:3; }
  table.ftable tbody tr:hover td{ background:#161d25; }
  table.ftable tbody tr:hover td.ft-label{ background:#1a222c; }
  table.ftable td.ft-good{ color:var(--mint); font-weight:600; }
  table.ftable td.ft-bad{ color:var(--coral); font-weight:600; }
  table.ftable td.ft-warn{ color:var(--amber); font-weight:600; }
  .co-table-scroll{
    overflow:auto; max-height:640px;
    border:1px solid var(--panel-border); border-radius:10px;
  }

  /* ── Điều hướng trang ── */
  nav.tabs{
    display:flex; gap:6px; background:var(--panel); border:1px solid var(--panel-border);
    border-radius:12px; padding:5px; margin-bottom:16px;
  }
  nav.tabs button{
    flex:1; background:transparent; border:none; border-radius:8px;
    color:var(--muted); font-family:'JetBrains Mono', monospace;
    font-size:12px; font-weight:500; padding:9px 10px; cursor:pointer;
    transition:background .15s, color .15s;
  }
  nav.tabs button.active{ background:var(--mint); color:#04231a; font-weight:700; }
  nav.tabs button:hover:not(.active){ color:var(--text); }
  .page{ display:none; }
  .page.active{ display:block; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="eyebrow">Danh mục cá nhân</div>
      <h1>Portfolio Tracker</h1>
      <div class="updated" id="updated">Đang tải…</div>
    </header>

    <nav class="tabs" id="pageTabs">
      <button type="button" data-page="overview" class="active">01 · Tổng quan</button>
      <button type="button" data-page="table">02 · Bảng dữ liệu</button>
      <button type="button" data-page="company">03 · Phân tích doanh nghiệp</button>
    </nav>

    <div id="page-overview" class="page active"></div>
  </div>

  <!-- Nằm ngoài .wrap (chứ không phải bên trong) để có thể rộng hơn 760px và
       canh giữa đúng theo toàn bộ viewport — xem CSS #page-table ở trên. -->
  <div id="page-table" class="page"></div>
  <div id="page-company" class="page"></div>

  <div class="wrap">
    <footer>Tự động cập nhật qua GitHub Actions · dữ liệu từ data/data.json</footer>
  </div>

<script>
async function loadData() {
  try {
    const res = await fetch('data/data.json?_=' + Date.now());
    if (!res.ok) throw new Error('not found');
    const json = await res.json();
    render(json);
  } catch (e) {
    document.getElementById('pageTabs').style.display = 'none';
    document.getElementById('page-table').style.display = 'none';
    document.getElementById('page-overview').classList.add('active');
    document.getElementById('page-overview').innerHTML = `
      <div class="empty">
        Chưa có dữ liệu.<br><br>
        Chạy workflow lần đầu (tab <b>Actions</b> → <b>Update Portfolio</b> → <b>Run workflow</b>)
        để tạo file <code>data/data.json</code>.
      </div>`;
    document.getElementById('updated').textContent = '';
  }
}

function fmtVND(n) {
  return new Intl.NumberFormat('vi-VN').format(Math.round(n)) + ' đ';
}
function fmtPct(n) {
  const v = (n * 100).toFixed(2) + '%';
  return (n >= 0 ? '+' : '') + v;
}

function render(json) {
  const s = json.summary || {};
  const hist = json.history || [];
  const events = json.events ?? [];
  const pos = json.positions ?? { as_of_date: null, items: [] };

  document.getElementById('updated').textContent =
    'Cập nhật lúc ' + (s.last_updated || '—');

  const crClass = (s.cumulative_return ?? 0) >= 0 ? 'pos' : 'neg';

  document.getElementById('page-overview').innerHTML = `
    <div class="hero">
      <div class="hero-value">${fmtVND(s.portfolio_value ?? 0)}</div>
      <div class="hero-profit ${(s.profit_total ?? 0) >= 0 ? 'pos' : 'neg'}">
        ${(s.profit_total ?? 0) >= 0 ? '+' : ''}${fmtVND(s.profit_total ?? 0)} lãi/lỗ
      </div>
      <div class="hero-sub">
        <div class="pill ${crClass}">
          <span class="lbl">Hiệu suất tích luỹ</span> ${fmtPct(s.cumulative_return ?? 0)}
        </div>
        <div class="pill">
          <span class="lbl">VNINDEX</span> ${fmtPct(s.cumulative_return_vni ?? 0)}
        </div>
      </div>
    </div>

    <div class="grid">
      <div class="stat">
        <div class="lbl">Sharpe ratio (tổng)</div>
        <div class="val">${s.sharpe_total != null ? s.sharpe_total.toFixed(2) : '—'}</div>
      </div>
      <div class="stat">
        <div class="lbl">Max drawdown (tổng)</div>
        <div class="val neg">${s.max_drawdown_total != null ? fmtPct(s.max_drawdown_total) : '—'}</div>
      </div>
    </div>

    <div class="chart-panel">
      <div class="chart-title">
        <span>Biểu đồ hiệu suất</span>
        <span class="legend" id="chartLegend">
          <span><span class="dot" style="background:var(--mint)"></span>Danh mục</span>
          <span id="vniLegendItem"><span class="dot" style="background:var(--line-vni)"></span>VNINDEX</span>
        </span>
      </div>
      <div class="chart-controls">
        <select class="year-select" id="metricSeg">
          <option value="value">Giá trị (đ)</option>
          <option value="pct">% Hiệu suất</option>
        </select>
        <select class="year-select" id="typeSeg">
          <option value="candle">Nến</option>
          <option value="line">Đường</option>
        </select>
        <select class="year-select" id="tfSeg">
          <option value="D">Ngày</option>
          <option value="W">Tuần</option>
          <option value="M">Tháng</option>
          <option value="Q">3 tháng</option>
          <option value="H">6 tháng</option>
          <option value="Y">Năm</option>
        </select>
      </div>
      <div class="chart-wrap">
        <div id="chartContainer"></div>
        <div class="chart-tooltip" id="chartTooltip"></div>
      </div>
    </div>

    <div class="chart-panel">
      <div class="chart-title">
        <span>Rủi ro &amp; hiệu suất</span>
        <select class="year-select" id="riskPeriodSelect"></select>
      </div>
      <div class="grid" style="margin-bottom:0;" id="riskGrid"></div>
    </div>

    <div class="table-panel" id="positionsPanel">
      <div class="table-title">
        <span>Phân bổ danh mục${pos.as_of_date ? ' · ' + fmtDate(pos.as_of_date) : ''}</span>
      </div>
      <div id="positionsTableWrap"></div>
    </div>

    <div class="table-panel" id="leveragePanel"></div>
  `;

  document.getElementById('page-table').innerHTML = `
    <div class="table-panel">
      <div class="table-title">
        <span>Bảng dữ liệu chi tiết (${hist.length} phiên)</span>
        <span class="table-hint">Cuộn dọc để xem thêm · ô giống nhau theo tháng/năm được gộp</span>
      </div>
      <div class="table-scroll" id="dataTableWrap"></div>
    </div>
  `;

  buildTable(hist);
  initPageTabs();
  buildPositionsTable(pos.items ?? []);
  buildLeveragePanel(pos.items ?? [], s.portfolio_value ?? 0);
  wireRiskPanel(s, hist);

  try {
    initChart(hist, events);
  } catch (e) {
    console.error('Không vẽ được biểu đồ:', e);
    const panel = document.querySelector('.chart-panel .chart-wrap');
    if (panel) {
      panel.innerHTML = '<div style="padding:20px 4px;color:var(--muted);font-size:12px;">Không tải được thư viện biểu đồ. Các số liệu khác vẫn hiển thị bình thường ở trên.</div>';
    }
  }
}

function fmtNum2(n) { return fmtNum(n, 2); }
function fmtPctPlain(n) {
  if (n === null || n === undefined || Number.isNaN(n)) return '—';
  return (n * 100).toFixed(2) + '%';
}

// ── BẢNG DỮ LIỆU (gộp ô các cột lặp giá trị theo tháng/năm) ─────────────────
// "w" = độ rộng tương đối của cột, ước theo số ký tự nội dung dài nhất có thể
// xuất hiện (vd "142.900" ~7 ký tự, "70.270.000" ~10 ký tự...). Dùng để chia
// % chiều rộng bảng cho từng cột (xem buildTable) thay vì chia đều 1/20 cho
// tất cả — nhờ vậy cột ngày đủ rộng để không xuống dòng mà các cột số ngắn
// cũng không bị kéo giãn thừa thãi, và tổng bảng luôn vừa khít khung (không
// cần cuộn ngang).
const TABLE_COLS = [
  { key: 'date',         label: 'date',    title: '',              cls: '',        w: 10, fmt: v => fmtDate(v) },
  { key: 'HPG',          label: 'HPG',     title: '',              cls: 'g-price',  w: 7,  fmt: v => fmtNum(v, 0) },
  { key: 'TCB',          label: 'TCB',     title: '',              cls: 'g-price',  w: 7,  fmt: v => fmtNum(v, 0) },
  { key: 'FPT',          label: 'FPT',     title: '',              cls: 'g-price',  w: 7,  fmt: v => fmtNum(v, 0) },
  { key: 'PNJ',          label: 'PNJ',     title: '',              cls: 'g-price',  w: 7,  fmt: v => fmtNum(v, 0) },
  { key: 'FRT',          label: 'FRT',     title: '',              cls: 'g-cyan',   w: 7,  fmt: v => fmtNum(v, 0) },
  { key: 'MWG',          label: 'MWG',     title: '',              cls: 'g-cyan',   w: 7,  fmt: v => fmtNum(v, 0) },
  { key: 'MBB',          label: 'MBB',     title: '',              cls: 'g-cyan',   w: 7,  fmt: v => fmtNum(v, 0) },
  { key: 'VNINDEX',      label: 'VNINDEX', title: '',              cls: 'g-vni',    w: 8,  fmt: v => fmtNum(v, 2) },
  { key: 'E1',           label: 'E1',      title: '',              cls: 'g-cash',   w: 9,  fmt: v => fmtNum(v, 0) },
  { key: 'W',            label: 'W',       title: '',              cls: 'g-cash',   w: 9,  fmt: v => fmtNum(v, 0) },
  { key: 'E0',           label: 'E0',      title: '',              cls: 'g-cash',   w: 9,  fmt: v => fmtNum(v, 0) },
  { key: 'D',            label: 'D',       title: '',              cls: 'g-cash',   w: 9,  fmt: v => fmtNum(v, 0) },
  { key: 'DR',           label: 'DR',      title: '',              cls: 'g-stat',   w: 7,  fmt: v => fmtPct(v) },
  { key: 'DR(VNI)',      label: 'DR(VNI)', title: '',              cls: 'g-stat',   w: 7,  fmt: v => fmtPct(v) },

  { key: 'MaxDrawdown',  label: 'MDD',     title: 'Max drawdown',  cls: 'g-stat',   w: 7,  fmt: v => fmtPct(v),  merge: true },
];

function fmtNum(n, decimals) {
  if (n === null || n === undefined || Number.isNaN(n)) return '—';
  return new Intl.NumberFormat('vi-VN', { minimumFractionDigits: decimals, maximumFractionDigits: decimals }).format(n);
}
function fmtDate(s) {
  if (!s) return '—';
  const [y, m, d] = s.split('-');
  return `${d}/${m}/${y}`;
}

// Với mỗi cột "merge", tính rowSpan cho ô đầu mỗi đoạn giá trị liên tiếp giống nhau.
// Cell thuộc đoạn (không phải ô đầu) sẽ có rowSpan = 0, nghĩa là bỏ qua khi render.
function computeRowSpans(rows, key) {
  const n = rows.length;
  const spans = new Array(n).fill(1);
  let i = 0;
  while (i < n) {
    let j = i;
    const v = rows[i][key];
    while (j + 1 < n && rows[j + 1][key] === v) j++;
    spans[i] = j - i + 1;
    for (let k = i + 1; k <= j; k++) spans[k] = 0;
    i = j + 1;
  }
  return spans;
}

function buildTable(hist) {
  const wrap = document.getElementById('dataTableWrap');
  if (!wrap) return;
  if (!hist.length) { wrap.innerHTML = ''; return; }

  // Mới nhất lên trên
  const rows = [...hist].reverse();

  const rowSpanMap = {};
  TABLE_COLS.forEach(col => {
    if (col.merge) rowSpanMap[col.key] = computeRowSpans(rows, col.key);
  });

  // colgroup: chia % chiều rộng bảng theo trọng số "w" của từng cột (xem
  // ghi chú tại TABLE_COLS) để bảng luôn vừa khít 100% khung chứa, không
  // bao giờ cần cuộn ngang trên desktop.
  const totalW = TABLE_COLS.reduce((sum, c) => sum + c.w, 0);
  const colgroup = `<colgroup>${TABLE_COLS.map(c =>
    `<col style="width:${(c.w / totalW * 100).toFixed(3)}%">`
  ).join('')}</colgroup>`;

  const thead = `<tr>${TABLE_COLS.map(c =>
    `<th class="${c.key === 'date' ? 'dt-date' : c.cls}"${c.title ? ` title="${c.title}"` : ''}>${c.label}</th>`
  ).join('')}</tr>`;

  const bodyRows = rows.map((r, i) => {
    const cells = TABLE_COLS.map(c => {
      if (c.merge) {
        const span = rowSpanMap[c.key][i];
        if (span === 0) return '';
        const rs = span > 1 ? ` rowspan="${span}"` : '';
        return `<td class="${c.cls}"${rs}>${c.fmt(r[c.key])}</td>`;
      }
      const cls = c.key === 'date' ? 'dt-date' : c.cls;
      return `<td class="${cls}">${c.fmt(r[c.key])}</td>`;
    }).join('');
    return `<tr>${cells}</tr>`;
  }).join('');

  wrap.innerHTML = `<table class="dtable">${colgroup}<thead>${thead}</thead><tbody>${bodyRows}</tbody></table>`;
}

// ── ĐÒN BẨY (bảng gọn trên tab Tổng quan) ───────────────────────────────────
// Không có sẵn field "margin" riêng trong data.json, nhưng có thể suy ra:
// giá trị thực (gross) của các mã CP đang nắm giữ = tổng value trong positions,
// còn portfolio_value (E1) là VỐN RÒNG (đã trừ nợ margin). Chênh lệch giữa
// hai số này chính là dư nợ margin hiện tại.
function buildLeveragePanel(items, equity) {
  const panel = document.getElementById('leveragePanel');
  if (!panel) return;
  const grossAssets = items.reduce((sum, p) => sum + (p.value ?? 0), 0);
  const margin = Math.max(0, grossAssets - equity);
  const leverage = equity > 0 ? grossAssets / equity : null;

  if (!items.length || equity <= 0) {
    panel.innerHTML = `
      <div class="table-title"><span>Đòn bẩy</span></div>
      <div style="padding:4px 4px 2px;color:var(--muted);font-size:12px;">Chưa có dữ liệu.</div>`;
    return;
  }

  panel.innerHTML = `
    <div class="table-title"><span>Đòn bẩy</span></div>
    <div class="grid lev-grid" style="margin-bottom:0;">
      <div class="stat">
        <div class="lbl">Tỷ lệ đòn bẩy</div>
        <div class="val">${leverage != null ? fmtNum(leverage, 2) + 'x' : '—'}</div>
      </div>
      <div class="stat">
        <div class="lbl">Dư nợ margin</div>
        <div class="val ${margin > 0 ? 'neg' : ''}">${fmtVND(margin)}</div>
      </div>
      <div class="stat">
        <div class="lbl">Tổng giá trị tài sản</div>
        <div class="val">${fmtVND(grossAssets)}</div>
      </div>
      <div class="stat">
        <div class="lbl">Vốn ròng (equity)</div>
        <div class="val">${fmtVND(equity)}</div>
      </div>
    </div>`;
}

// ── RỦI RO & HIỆU SUẤT (dropdown chọn Tất cả / theo từng năm) ──────────────
function riskMetricsForYear(hist, year) {
  // Các cột Beta/Alpha/Volatility/Correlation/Sharpe/MaxDrawdown/XIRR_Year
  // giữ nguyên giá trị suốt cả năm đó trong data.json, nên lấy dòng gần nhất
  // của năm là đủ đại diện cho cả năm.
  let row = null;
  for (const r of hist) {
    if (r.date && r.date.slice(0, 4) === year) row = r;
  }
  if (!row) return null;
  return {
    return_: row.YR, beta: row.Beta, alpha: row.Alpha, volatility: row.Volatility,
    correlation: row.Correlation, sharpe: row.Sharpe,
    maxdrawdown: row.MaxDrawdown, xirr: row.XIRR_Year, profit: row.ProfitYear,
  };
}

function riskMetricsTotal(s) {
  return {
    // Tất cả: lấy CR mới nhất (đã là lợi nhuận tích luỹ tính đến hiện tại).
    return_: s.cumulative_return,
    beta: s.beta_total, alpha: s.alpha_total, volatility: s.volatility_total,
    correlation: s.correlation_total, sharpe: s.sharpe_total,
    maxdrawdown: s.max_drawdown_total, xirr: s.xirr_total, profit: s.profit_total,
  };
}

// ── Ghi nhớ lựa chọn hiển thị giữa các lần truy cập (localStorage) ─────────
// Dùng chung 1 tiền tố khoá để dễ quản lý; nếu trình duyệt chặn localStorage
// (chế độ ẩn danh khắt khe...) thì lặng lẽ bỏ qua, trang vẫn hoạt động bình
// thường với giá trị mặc định.
const PREFS_KEY_CHART = 'ptv1.chartPrefs';   // { metric, type, tf }
const PREFS_KEY_RISK  = 'ptv1.riskPeriod';   // 'total' hoặc năm, vd '2026'

function loadPref(key) {
  try {
    const raw = localStorage.getItem(key);
    return raw != null ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function savePref(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* bỏ qua */ }
}

function wireRiskPanel(s, hist) {
  const select = document.getElementById('riskPeriodSelect');
  if (!select) return;

  const years = [...new Set(hist.map(r => (r.date || '').slice(0, 4)).filter(Boolean))]
    .sort((a, b) => b.localeCompare(a));

  select.innerHTML = `<option value="total">Tất cả</option>` +
    years.map(y => `<option value="${y}">${y}</option>`).join('');

  // Khôi phục lựa chọn kỳ đã xem lần gần nhất (nếu vẫn còn hợp lệ trong danh
  // sách năm hiện có), mặc định "Tất cả" nếu chưa từng chọn hoặc năm đó
  // không còn dữ liệu.
  const saved = loadPref(PREFS_KEY_RISK);
  const initial = (saved === 'total' || years.includes(saved)) ? saved : 'total';
  select.value = initial;

  renderRiskGrid(initial === 'total' ? riskMetricsTotal(s) : riskMetricsForYear(hist, initial));

  select.onchange = () => {
    const v = select.value;
    savePref(PREFS_KEY_RISK, v);
    renderRiskGrid(v === 'total' ? riskMetricsTotal(s) : riskMetricsForYear(hist, v));
  };
}

// ── CHART (TradingView Lightweight Charts) ─────────────────────────────────
function initChart(hist, events) {
  if (typeof LightweightCharts === 'undefined' || !hist.length) return;

  // 0. Map ngày → sự kiện (gộp sẵn theo ngày ở backend). Mỗi event có "category":
  //    "trade" (mua/bán CP thật, có thể kèm cash/margin) — marker mũi tên
  //    xanh/đỏ như cũ; "margin_only" (chỉ đổi margin, không mua/bán CP —
  //    thường là nạp tiền trả bớt/khoản vay thêm margin) và "corporate_action"
  //    (CP đổi do chia tách/cổ tức bằng CP, không cashflow, không margin) —
  //    cả hai loại này hiện marker màu vàng (--amber) riêng, xem updateMarkers().
  const eventsByDate = new Map();
  (events || []).forEach(ev => {
    if (!ev || !ev.date) return;
    eventsByDate.set(ev.date, ev);
  });
  function timeToKey(t) {
    if (typeof t === 'string') return t;
    if (t && typeof t === 'object' && 'year' in t) {
      const pad = n => String(n).padStart(2, '0');
      return `${t.year}-${pad(t.month)}-${pad(t.day)}`;
    }
    return String(t);
  }

  // 1. Chuẩn hoá dữ liệu ngày: giá trị danh mục (VNĐ) và % lợi nhuận tích luỹ
  const daily = hist.map(r => ({
    date: r.date,
    value: r.E1 ?? 0,
    pct: (r.CR ?? 0) * 100,
    vniPct: (r['CR(VNI)'] ?? 0) * 100,
  }));

  // 2. Dựng nến kiểu "close-to-close": open = giá đóng phiên trước đó
  //    (data.json chỉ lưu giá trị cuối ngày, không có OHLC thật trong ngày)
  function toOHLC(key) {
    let prev = null;
    return daily.map(d => {
      const close = d[key];
      const open = prev === null ? close : prev;
      prev = close;
      return { time: d.date, open, high: Math.max(open, close), low: Math.min(open, close), close };
    });
  }
  const dailyOHLC = { value: toOHLC('value'), pct: toOHLC('pct') };
  const dailyVniOHLC = toOHLC('vniPct');

  function periodKey(dateStr, tf) {
    if (tf === 'D') return dateStr;
    const d = new Date(dateStr + 'T00:00:00');
    if (tf === 'M') return dateStr.slice(0, 7) + '-01';
    if (tf === 'Q') {
      const qStartMonth = Math.floor(d.getMonth() / 3) * 3; // 0,3,6,9
      return `${d.getFullYear()}-${String(qStartMonth + 1).padStart(2, '0')}-01`;
    }
    if (tf === 'H') {
      const hStartMonth = d.getMonth() < 6 ? 0 : 6; // 0 hoặc 6
      return `${d.getFullYear()}-${String(hStartMonth + 1).padStart(2, '0')}-01`;
    }
    if (tf === 'Y') return `${d.getFullYear()}-01-01`;
    const dow = (d.getDay() + 6) % 7; // 0 = thứ 2
    const monday = new Date(d);
    monday.setDate(d.getDate() - dow);
    return monday.toISOString().slice(0, 10);
  }

  function aggregate(ohlc, tf) {
    if (tf === 'D') return ohlc;
    const groups = new Map();
    for (const c of ohlc) {
      const key = periodKey(c.time, tf);
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(c);
    }
    const out = [];
    for (const [key, arr] of groups) {
      out.push({
        time: key,
        open: arr[0].open,
        close: arr[arr.length - 1].close,
        high: Math.max(...arr.map(x => x.high)),
        low: Math.min(...arr.map(x => x.low)),
      });
    }
    out.sort((a, b) => a.time.localeCompare(b.time));
    return out;
  }

  const container = document.getElementById('chartContainer');
  const tooltip = document.getElementById('chartTooltip');
  const vniLegendItem = document.getElementById('vniLegendItem');

  const chart = LightweightCharts.createChart(container, {
    autoSize: true,
    layout: { background: { color: 'transparent' }, textColor: '#7c8b9a', fontFamily: "'JetBrains Mono', monospace", fontSize: 10 },
    grid: { vertLines: { color: '#1e2630' }, horzLines: { color: '#1e2630' } },
    rightPriceScale: { borderColor: '#1e2630' },
    timeScale: { borderColor: '#1e2630', timeVisible: false, rightOffset: 3 },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    handleScroll: true,
    handleScale: true,
  });

  const candleSeries = chart.addCandlestickSeries({
    upColor: '#3ddc97', downColor: '#f8615a', borderVisible: false,
    wickUpColor: '#3ddc97', wickDownColor: '#f8615a',
  });
  const lineSeries = chart.addLineSeries({ color: '#3ddc97', lineWidth: 2 });
  const vniSeries = chart.addLineSeries({ color: '#7a8ea3', lineWidth: 1.5 });

  // Khôi phục lựa chọn hiển thị (Giá trị/%, Nến/Đường, khung thời gian) từ
  // lần truy cập gần nhất; chỉ nhận giá trị hợp lệ, còn lại dùng mặc định.
  const savedChartPrefs = loadPref(PREFS_KEY_CHART) || {};
  const state = {
    metric: ['value', 'pct'].includes(savedChartPrefs.metric) ? savedChartPrefs.metric : 'value',
    type:   ['candle', 'line'].includes(savedChartPrefs.type) ? savedChartPrefs.type : 'candle',
    tf:     ['D', 'W', 'M', 'Q', 'H', 'Y'].includes(savedChartPrefs.tf) ? savedChartPrefs.tf : 'D',
  };

  // Đồng bộ giá trị đang chọn trên 3 dropdown cho khớp với state vừa khôi
  // phục (mặc định HTML luôn chọn option đầu tiên, cần cập nhật lại nếu
  // người dùng lần trước đã chọn khác).
  function syncSelectUI(id, value) {
    const el = document.getElementById(id);
    if (el) el.value = value;
  }
  syncSelectUI('metricSeg', state.metric);
  syncSelectUI('typeSeg', state.type);
  syncSelectUI('tfSeg', state.tf);

  function currentData() {
    const src = state.metric === 'value' ? dailyOHLC.value : dailyOHLC.pct;
    return aggregate(src, state.tf);
  }
  function currentVniData() {
    return aggregate(dailyVniOHLC, state.tf);
  }

  // Gộp sự kiện theo cùng đơn vị thời gian đang hiển thị (Ngày/Tuần/Tháng) để
  // mỗi nến tuần/tháng vẫn hiện đủ thay đổi CP/cashflow/margin diễn ra trong
  // kỳ đó (cộng dồn qty theo mã, cộng dồn cash_in/cash_out/margin_delta).
  function eventsGroupedByTf(tf) {
    if (tf === 'D') return eventsByDate;
    const map = new Map();
    for (const [date, ev] of eventsByDate) {
      const key = periodKey(date, tf);
      if (!map.has(key)) map.set(key, { date: key, stocks: {}, corp_stocks: {}, cash_in: 0, cash_out: 0, margin_delta: 0 });
      const g = map.get(key);
      for (const [sym, qty] of Object.entries(ev.stocks || {})) {
        g.stocks[sym] = (g.stocks[sym] || 0) + qty;
      }
      for (const [sym, qty] of Object.entries(ev.corp_stocks || {})) {
        g.corp_stocks[sym] = (g.corp_stocks[sym] || 0) + qty;
      }
      g.cash_in  += ev.cash_in  || 0;
      g.cash_out += ev.cash_out || 0;
      g.margin_delta += ev.margin_delta || 0;
    }
    return map;
  }

  let lastRenderedTimes = [];
  let currentEventsByPeriod = eventsByDate;

  function rebuild() {
    const ohlc = currentData();
    lastRenderedTimes = ohlc.map(c => c.time);
    currentEventsByPeriod = eventsGroupedByTf(state.tf);
    const showCandle = state.type === 'candle';
    const showVni = !showCandle && state.metric === 'pct';

    candleSeries.applyOptions({ visible: showCandle });
    lineSeries.applyOptions({ visible: !showCandle });
    vniSeries.applyOptions({ visible: showVni });
    vniLegendItem.style.display = showVni ? 'flex' : 'none';

    if (showCandle) {
      candleSeries.setData(ohlc);
    } else {
      lineSeries.setData(ohlc.map(c => ({ time: c.time, value: c.close })));
      if (showVni) {
        vniSeries.setData(currentVniData().map(c => ({ time: c.time, value: c.close })));
      }
    }

    candleSeries.applyOptions({
      priceFormat: state.metric === 'value'
        ? { type: 'custom', formatter: v => new Intl.NumberFormat('vi-VN').format(Math.round(v)) }
        : { type: 'custom', formatter: v => v.toFixed(2) + '%' },
    });
    lineSeries.applyOptions({ priceFormat: candleSeries.options().priceFormat });

    updateMarkers();
    chart.timeScale().fitContent();
  }

  // ── Marker trên chart, hiện ở mọi khung Ngày/Tuần/Tháng, gộp theo kỳ đang
  //    xem để không bị lệch ngày:
  //    - Mua/bán CP thật (ev.stocks): mũi tên xanh (mua/arrowUp) / đỏ
  //      (bán/arrowDown), như cũ.
  //    - Chỉ đổi margin, không mua/bán CP (ev.margin_delta != 0 và ev.stocks
  //      rỗng) — thường là nạp thêm tiền trả bớt margin: chấm tròn màu vàng
  //      (--amber), hướng lên nếu margin tăng, hướng xuống nếu margin giảm.
  //    - Chia tách CP / cổ tức bằng CP (ev.corp_stocks): ô vuông màu vàng
  //      (--amber), để phân biệt với mua/bán thật. ──
  const AMBER = '#f0b64c';
  function updateMarkers() {
    const activeSeries = state.type === 'candle' ? candleSeries : lineSeries;
    const otherSeries = state.type === 'candle' ? lineSeries : candleSeries;
    otherSeries.setMarkers([]);

    if (!currentEventsByPeriod || currentEventsByPeriod.size === 0) {
      activeSeries.setMarkers([]);
      return;
    }
    const validTimes = new Set(lastRenderedTimes);
    const markers = [];
    for (const [key, ev] of currentEventsByPeriod) {
      if (!validTimes.has(key)) continue;

      const hasTrade = Object.values(ev.stocks || {}).some(qty => qty);
      Object.entries(ev.stocks || {}).forEach(([symbol, qty]) => {
        if (!qty) return;
        const isBuy = qty > 0;
        markers.push({
          time: key,
          position: isBuy ? 'belowBar' : 'aboveBar',
          color: isBuy ? '#3ddc97' : '#f8615a',
          shape: isBuy ? 'arrowUp' : 'arrowDown',
          text: symbol || '',
        });
      });

      // Ngày chỉ đổi margin (nạp/rút tiền trả bớt margin), không có mua/bán CP.
      if (!hasTrade && ev.margin_delta) {
        const isUp = ev.margin_delta > 0;
        markers.push({
          time: key,
          position: isUp ? 'belowBar' : 'aboveBar',
          color: AMBER,
          shape: 'circle',
          text: isUp ? 'Vay margin' : 'Trả margin',
        });
      }

      // Chia tách CP / cổ tức bằng CP.
      const corpSymbols = Object.entries(ev.corp_stocks || {}).filter(([, qty]) => qty);
      if (corpSymbols.length) {
        markers.push({
          time: key,
          position: 'aboveBar',
          color: AMBER,
          shape: 'square',
          text: corpSymbols.map(([sym]) => sym).join(', '),
        });
      }
    }
    markers.sort((a, b) => a.time.localeCompare(b.time));
    activeSeries.setMarkers(markers);
  }

  // ── Điều khiển dropdown (Giá trị/%, Nến/Đường, khung thời gian) ──
  function wireSelect(id, stateKey) {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('change', () => {
      state[stateKey] = el.value;
      savePref(PREFS_KEY_CHART, { metric: state.metric, type: state.type, tf: state.tf });
      rebuild();
    });
  }
  wireSelect('metricSeg', 'metric');
  wireSelect('typeSeg', 'type');
  wireSelect('tfSeg', 'tf');

  // Nhãn thời gian hiển thị trong tooltip: theo Ngày thì hiện đúng ngày,
  // theo Tuần/Tháng thì hiện cả khoảng/kỳ để không gây hiểu nhầm là chỉ 1 ngày.
  function periodLabel(key, tf) {
    if (tf === 'D') return fmtDate(key);
    if (tf === 'M') {
      const [y, m] = key.split('-');
      return `Tháng ${m}/${y}`;
    }
    if (tf === 'Q') {
      const [y, m] = key.split('-');
      const q = Math.floor((parseInt(m, 10) - 1) / 3) + 1;
      return `Quý ${q}/${y}`;
    }
    if (tf === 'H') {
      const [y, m] = key.split('-');
      const half = parseInt(m, 10) <= 6 ? 1 : 2;
      return `Nửa năm ${half}/${y}`;
    }
    if (tf === 'Y') return `Năm ${key.slice(0, 4)}`;
    const start = new Date(key + 'T00:00:00');
    const end = new Date(start);
    end.setDate(start.getDate() + 6);
    const f = d => `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}`;
    return `Tuần ${f(start)} - ${f(end)}/${end.getFullYear()}`;
  }

  // ── Crosshair: hiện giá trị tại thời điểm đang trỏ ──
  chart.subscribeCrosshairMove(param => {
    if (!param || !param.time || !param.point) {
      tooltip.style.display = 'none';
      return;
    }
    const activeSeries = state.type === 'candle' ? candleSeries : lineSeries;
    const d = param.seriesData.get(activeSeries);
    if (!d) { tooltip.style.display = 'none'; return; }

    const isPct = state.metric === 'pct';
    const fmt = v => isPct ? (v >= 0 ? '+' : '') + v.toFixed(2) + '%' : fmtVND(v);

    let rows = '';
    if (state.type === 'candle') {
      const dir = d.close >= d.open ? 'tt-up' : 'tt-down';
      rows = `
        <div class="tt-row"><span class="tt-lbl">Mở</span><span>${fmt(d.open)}</span></div>
        <div class="tt-row"><span class="tt-lbl">Đóng</span><span class="${dir}">${fmt(d.close)}</span></div>`;
    } else {
      rows = `<div class="tt-row"><span class="tt-lbl">Danh mục</span><span>${fmt(d.value)}</span></div>`;
      const vd = param.seriesData.get(vniSeries);
      if (vd && vniSeries.options().visible) {
        rows += `<div class="tt-row"><span class="tt-lbl">VNINDEX</span><span>${(vd.value >= 0 ? '+' : '') + vd.value.toFixed(2)}%</span></div>`;
      }
    }

    // Nếu kỳ đang hover có giao dịch (mua/bán CP, nạp/rút tiền, đổi margin),
    // thêm các dòng tương ứng: mỗi mã CP hiện đổi số lượng (dấu +/-), D/W lấy
    // từ cashflows, margin hiện THAY ĐỔI (delta) chứ không phải số dư tuyệt đối.
    const periodEv = currentEventsByPeriod.get(timeToKey(param.time));
    if (periodEv) {
      Object.entries(periodEv.stocks || {}).forEach(([symbol, qty]) => {
        if (!qty) return;
        const dir = qty > 0 ? 'tt-up' : 'tt-down';
        rows += `<div class="tt-row"><span class="tt-lbl">${symbol}</span><span class="${dir}">${qty > 0 ? '+' : ''}${fmtNum(qty, 0)}</span></div>`;
      });
      Object.entries(periodEv.corp_stocks || {}).forEach(([symbol, qty]) => {
        if (!qty) return;
        rows += `<div class="tt-row"><span class="tt-lbl">${symbol} (chia tách/cổ tức)</span><span class="tt-amber">${qty > 0 ? '+' : ''}${fmtNum(qty, 0)}</span></div>`;
      });
      if (periodEv.cash_in) {
        rows += `<div class="tt-row"><span class="tt-lbl">D</span><span class="tt-up">+${fmtVND(periodEv.cash_in)}</span></div>`;
      }
      if (periodEv.cash_out) {
        rows += `<div class="tt-row"><span class="tt-lbl">W</span><span class="tt-down">-${fmtVND(periodEv.cash_out)}</span></div>`;
      }
      if (periodEv.margin_delta) {
        const dir = periodEv.margin_delta > 0 ? 'tt-up' : 'tt-down';
        rows += `<div class="tt-row"><span class="tt-lbl">Margin</span><span class="${dir}">${periodEv.margin_delta > 0 ? '+' : ''}${fmtVND(periodEv.margin_delta)}</span></div>`;
      }
    }

    tooltip.innerHTML = `<div class="tt-date">${periodLabel(timeToKey(param.time), state.tf)}</div>${rows}`;
    tooltip.style.display = 'block';

    const cw = container.clientWidth;
    const tw = 160;
    let left = param.point.x + 14;
    if (left + tw > cw) left = param.point.x - tw - 14;
    tooltip.style.left = Math.max(4, left) + 'px';
    tooltip.style.top = '6px';
  });

  rebuild();
}

// ── TAB 03 · PHÂN TÍCH DOANH NGHIỆP ─────────────────────────────────────────
// Dữ liệu nạp từ data/companies.json (do fetch_company_financials.py tạo qua
// GitHub Actions, đọc trực tiếp các file .xlsx trong folder "đc/" trên Google
// Drive). Luồng: chọn doanh nghiệp → chọn sheet → hiện bảng.
const companyState = { loaded: false, data: null, ticker: null, sheet: null };

async function ensureCompanyData() {
  if (companyState.loaded) return;
  const wrap = document.getElementById('page-company');
  wrap.innerHTML = `<div class="empty">Đang tải dữ liệu…</div>`;
  try {
    const res = await fetch('data/companies.json?_=' + Date.now());
    if (!res.ok) throw new Error('not found');
    const json = await res.json();
    companyState.data = json.companies || {};
    companyState.loaded = true;
    renderCompanyRoot();
  } catch (e) {
    wrap.innerHTML = `
      <div class="empty">
        Chưa có dữ liệu doanh nghiệp.<br><br>
        Cấu hình secret <code>GOOGLE_DRIVE_COMPANIES_FOLDER_ID</code> trỏ tới folder
        <code>đc/</code> trên Google Drive rồi chạy lại workflow
        (tab <b>Actions</b> → <b>Update Portfolio</b> → <b>Run workflow</b>)
        để tạo file <code>data/companies.json</code>.
      </div>`;
  }
}

function coCrumbHtml() {
  const parts = [`<button type="button" data-crumb="root">Doanh nghiệp</button>`];
  if (companyState.ticker) {
    parts.push(`<span class="sep">/</span>`);
    parts.push(companyState.sheet
      ? `<button type="button" data-crumb="company">${companyState.ticker}</button>`
      : `<span>${companyState.ticker}</span>`);
  }
  if (companyState.sheet) {
    parts.push(`<span class="sep">/</span><span>${companyState.sheet}</span>`);
  }
  return `<div class="co-crumb">${parts.join('')}</div>`;
}

function wireCoCrumb(wrap) {
  wrap.querySelectorAll('.co-crumb [data-crumb]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.dataset.crumb === 'root') { companyState.ticker = null; companyState.sheet = null; renderCompanyRoot(); }
      else if (btn.dataset.crumb === 'company') { companyState.sheet = null; renderCompanySheetList(); }
    });
  });
}

function renderCompanyRoot() {
  const wrap = document.getElementById('page-company');
  const tickers = Object.keys(companyState.data).sort();
  if (!tickers.length) {
    wrap.innerHTML = `<div class="empty">Chưa có doanh nghiệp nào trong data/companies.json.</div>`;
    return;
  }
  wrap.innerHTML = `
    <div class="table-panel">
      <div class="table-title"><span>Chọn doanh nghiệp</span></div>
      <div class="chip-grid" id="coTickerGrid">
        ${tickers.map(t => `<button type="button" class="chip" data-ticker="${t}">${t}</button>`).join('')}
      </div>
    </div>`;
  wrap.querySelectorAll('[data-ticker]').forEach(btn => {
    btn.addEventListener('click', () => {
      companyState.ticker = btn.dataset.ticker;
      companyState.sheet = null;
      renderCompanySheetList();
    });
  });
}

function renderCompanySheetList() {
  const wrap = document.getElementById('page-company');
  const co = companyState.data[companyState.ticker];
  const sheets = co?.sheets || [];
  wrap.innerHTML = `
    ${coCrumbHtml()}
    <div class="table-panel">
      <div class="table-title">
        <span>${companyState.ticker}${co?.file_name ? ' · ' + co.file_name : ''}</span>
      </div>
      <div class="chip-grid">
        ${sheets.map(s => `<button type="button" class="chip sheet-chip" data-sheet="${s.name}">${s.name}</button>`).join('')}
      </div>
    </div>`;
  wireCoCrumb(wrap);
  wrap.querySelectorAll('[data-sheet]').forEach(btn => {
    btn.addEventListener('click', () => {
      companyState.sheet = btn.dataset.sheet;
      renderCompanySheetTable();
    });
  });
}

// Định dạng 1 cell: số → nhóm hàng nghìn theo vi-VN (âm tô màu coral), text/None giữ nguyên.
function fmtCoCell(v) {
  if (v === null || v === undefined || v === '') return '';
  if (typeof v === 'number') {
    const isInt = Number.isInteger(v);
    return new Intl.NumberFormat('vi-VN', {
      minimumFractionDigits: isInt ? 0 : 2,
      maximumFractionDigits: isInt ? 0 : 2,
    }).format(v);
  }
  return String(v);
}

// ── Quy tắc định dạng riêng cho sheet "chi_so_tai_chinh" ────────────────────
// Bám theo TỪ KHÓA trong tên hàng (cột đầu), không bám theo vị trí/thứ tự
// hàng → đổi thứ tự hàng không ảnh hưởng gì. Nếu đổi TÊN hàng nhưng vẫn giữ
// từ khóa gốc (vd vẫn còn chữ "ROE", "D/E", "Biên lợi nhuận gộp"...) thì vẫn
// nhận đúng; nếu đổi tên khác hẳn (mất hết từ khóa) thì dòng đó sẽ rơi về xử
// lý mặc định (xem classifyRatioRow) và mất tô màu, cần sửa lại rule bên dưới.
const RATIO_SHEET_NAME = 'chi_so_tai_chinh';

// Các dòng luôn hiển thị SỐ (không phải %) dù nằm trong sheet tỷ số.
const PLAIN_NUMBER_KEYWORDS = ['DPO', 'DSO', 'DIO', 'vòng quay tiền mặt', 'số ngày'];

// Ngưỡng nhận diện "dòng tỷ số" theo độ lớn giá trị: nếu giá trị tuyệt đối
// lớn nhất trong dòng < RATIO_MAGNITUDE_THRESHOLD → coi là tỷ số (hiển thị %);
// ngược lại (số dư tuyệt đối như EBIT, FCF, Capex... hoặc số vòng/ngày lớn)
// → hiển thị số thường. Cách này tự động đúng cho hầu hết dòng mà không cần
// liệt kê tên từng dòng, và không bị ảnh hưởng khi đổi thứ tự/tên hàng.
const RATIO_MAGNITUDE_THRESHOLD = 8;

function normLabel(label) {
  return String(label ?? '').toLowerCase();
}

function rowHasKeyword(label, keywords) {
  const l = normLabel(label);
  return keywords.some(k => l.includes(k.toLowerCase()));
}

// Trả về 'percent' hoặc 'plain' cho cả dòng (áp dụng đồng nhất cho mọi cột).
function classifyRatioRow(label, values) {
  if (rowHasKeyword(label, PLAIN_NUMBER_KEYWORDS)) return 'plain';
  const nums = values.filter(v => typeof v === 'number');
  if (!nums.length) return 'plain';
  const maxAbs = Math.max(...nums.map(v => Math.abs(v)));
  return maxAbs < RATIO_MAGNITUDE_THRESHOLD ? 'percent' : 'plain';
}

// Quy tắc tô màu theo ngưỡng, khớp theo từ khóa tên dòng (không phân biệt hoa/thường).
// colorize(v) nhận giá trị GỐC (dạng phân số, vd 0.15 = 15%), trả về 'good'|'bad'|'warn'|null.
const RATIO_COLOR_RULES = [
  { keyword: 'roe', colorize: v => v >= 0.15 ? 'good' : 'bad' },
  { keyword: 'tăng trưởng ln', colorize: growthColor },
  { keyword: 'tăng trưởng doanh thu', colorize: growthColor },
  { keyword: 'biên lợi nhuận gộp', colorize: v => v >= 0.3 ? 'good' : (v < 0.1 ? 'bad' : 'warn') },
  { keyword: 'biên lợi nhuận ròng', colorize: v => v >= 0.1 ? 'good' : null },
  { keyword: 'd/e', colorize: v => v <= 0.5 ? 'good' : null },
  { keyword: 'tiền và tương đương tiền/tài sản', colorize: v => (v >= 0.02 && v <= 0.3) ? 'good' : 'bad' },
];
function growthColor(v) {
  if (v < 0.1) return 'bad';
  if (v >= 0.15) return 'good';
  return 'warn';
}

function ratioCellColorClass(label, v) {
  if (typeof v !== 'number') return '';
  const l = normLabel(label);
  const rule = RATIO_COLOR_RULES.find(r => l.includes(r.keyword));
  if (!rule) return '';
  const verdict = rule.colorize(v);
  return verdict ? ` ft-${verdict}` : '';
}

function fmtRatioPercent(v) {
  return (v * 100).toLocaleString('vi-VN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '%';
}

function renderCompanySheetTable() {
  const wrap = document.getElementById('page-company');
  const co = companyState.data[companyState.ticker];
  const sheet = (co?.sheets || []).find(s => s.name === companyState.sheet);
  const rows = sheet?.rows || [];
  const isRatioSheet = companyState.sheet === RATIO_SHEET_NAME;

  let tableHtml = '<div class="empty">Sheet không có dữ liệu.</div>';
  if (rows.length) {
    const header = rows[0];
    const body = rows.slice(1);
    const thead = `<tr>${header.map((h, i) =>
      `<th class="${i === 0 ? 'ft-label' : ''}">${h ?? ''}</th>`).join('')}</tr>`;
    const tbody = body.map(row => {
      const label = row[0];
      const rowFormat = isRatioSheet ? classifyRatioRow(label, row.slice(1)) : 'plain';
      const cells = row.map((v, i) => {
        if (i === 0) return `<td class="ft-label">${v ?? ''}</td>`;
        if (typeof v !== 'number') return `<td>${fmtCoCell(v)}</td>`;
        const colorClass = isRatioSheet ? ratioCellColorClass(label, v) : (v < 0 ? ' ft-bad' : '');
        const text = rowFormat === 'percent' ? fmtRatioPercent(v) : fmtCoCell(v);
        return `<td class="${colorClass}">${text}</td>`;
      }).join('');
      return `<tr>${cells}</tr>`;
    }).join('');
    tableHtml = `<div class="co-table-scroll"><table class="ftable"><thead>${thead}</thead><tbody>${tbody}</tbody></table></div>`;
  }

  wrap.innerHTML = `
    ${coCrumbHtml()}
    <div class="table-panel">
      <div class="table-title">
        <span>${companyState.ticker} · ${companyState.sheet}</span>
        <span class="table-hint">${rows.length ? (rows.length - 1) + ' dòng · cuộn để xem thêm' : ''}</span>
      </div>
      ${tableHtml}
    </div>`;
  wireCoCrumb(wrap);
}

// ── ĐIỀU HƯỚNG TRANG (Tổng quan / Bảng dữ liệu / Phân tích doanh nghiệp) ────
function initPageTabs() {
  const tabs = document.getElementById('pageTabs');
  if (!tabs || tabs.dataset.wired) return; // chỉ gắn sự kiện 1 lần
  tabs.dataset.wired = '1';

  function showPage(name) {
    tabs.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.page === name));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    const el = document.getElementById('page-' + name);
    if (el) el.classList.add('active');
    // Biểu đồ dùng canvas: cần resize lại khi panel vừa được hiện ra
    if (name === 'overview') window.dispatchEvent(new Event('resize'));
    if (name === 'company') ensureCompanyData();
  }

  const validPages = ['overview', 'table', 'company'];

  tabs.addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const name = btn.dataset.page;
    if (location.hash !== '#' + name) location.hash = name;
    else showPage(name);
  });

  window.addEventListener('hashchange', () => {
    const name = location.hash.replace('#', '') || 'overview';
    showPage(validPages.includes(name) ? name : 'overview');
  });

  // Mở đúng trang theo hash lúc tải trang (cho phép link thẳng tới #table, #company)
  const initial = location.hash.replace('#', '');
  showPage(validPages.includes(initial) ? initial : 'overview');
}

loadData();
</script>
